<style>
:root{--bg:#f7f7f4;--card:#fff;--tx:#1d1d1b;--mut:#5d5d58;--bd:#d9d8d2;--ac:#1f5fbf;--acbg:#e6eefb;--ok:#17803d;--okbg:#e3f4e8;--bad:#b42318;--badbg:#fdeceb;--warn:#8a5a00;--warnbg:#fff4d6;--code:#f3f2ee;--kw:#8a2bb5;--ty:#0b6e99;--st:#a3480b;--nu:#16794a;--cm:#7b7b74;--pp:#a01f5b;--mask:#ffe08a;--diff:#fff2b3}

:root[data-theme="dark"]{--bg:#161615;--card:#21211f;--tx:#ecebe6;--mut:#a9a8a1;--bd:#3a3936;--ac:#7fb0ff;--acbg:#1f2b40;--ok:#6fd08c;--okbg:#17301f;--bad:#ff8a80;--badbg:#3a1a18;--warn:#f2c14e;--warnbg:#3a2f12;--code:#1a1a19;--kw:#d49cff;--ty:#6cc4ee;--st:#f0a070;--nu:#7fd6a0;--cm:#8d8c86;--pp:#ff86b8;--mask:#6b5410;--diff:#3d3510;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd)}
.top{display:flex;align-items:center;gap:12px;padding:8px 16px;flex-wrap:wrap}
.top h1{font-size:19px;margin:0}
.bar{flex:1;min-width:160px;height:10px;background:var(--bd);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok)}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 12px 6px}
nav button{white-space:nowrap}
button{font:inherit;font-size:15px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}
button.on,nav button.on{background:var(--ac);color:var(--card);border-color:var(--ac)}
button.okb{border-color:var(--ok);color:var(--ok)} button.badb{border-color:var(--bad);color:var(--bad)}
main{max-width:1000px;margin:0 auto;padding:16px}
section{display:none} section.show{display:block}
h2{font-size:24px;margin:8px 0 12px} h3{font-size:19px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin:0 0 16px}
.mut{color:var(--mut)} .small{font-size:14px}
.badge{display:inline-block;font-size:13px;padding:1px 8px;border-radius:20px;border:1px solid var(--bd);margin-right:4px;white-space:nowrap}
.t1{background:var(--badbg);color:var(--bad);border-color:var(--bad);font-weight:700}
.t2{background:var(--acbg);color:var(--ac);border-color:var(--ac)}
.t3{background:var(--code);color:var(--mut)}
.stars{color:#d99a00;letter-spacing:1px}
pre{max-width:100%;background:var(--code);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;overflow-x:auto;font:15px/1.45 Consolas,"Courier New",ui-monospace,monospace;margin:6px 0;tab-size:4}
pre .ln{display:block;min-height:1.45em}
pre .chg{background:var(--diff)}
.k{color:var(--kw);font-weight:600}.ty{color:var(--ty)}.s{color:var(--st)}.n{color:var(--nu)}.c{color:var(--cm);font-style:italic}.p{color:var(--pp)}
.mask{background:var(--mask);border-radius:4px;cursor:pointer;color:transparent;user-select:none;padding:0 2px}
.mask::before{content:"____";color:var(--tx)}
.mask>*{display:none}
.mask.rv{background:var(--okbg);color:inherit}.mask.rv::before{content:""}.mask.rv>*{display:inline}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2>div{min-width:0}a.badge{white-space:normal}td{overflow-wrap:anywhere}
@media (max-width:700px){.grid2{grid-template-columns:1fr} body{font-size:16px} pre{font-size:13.5px}}
.lbl{font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.3px;margin-top:10px}
.box{border-left:4px solid var(--bd);padding:4px 10px;margin:8px 0;border-radius:4px}
.b-meo{border-color:var(--ok);background:var(--okbg)} .b-sai{border-color:var(--bad);background:var(--badbg)} .b-gd{border-color:var(--warn);background:var(--warnbg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
input[type=text],input[type=search],select,textarea{font:inherit;font-size:16px;padding:6px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
textarea{width:100%;min-height:260px;font:15px/1.45 Consolas,"Courier New",monospace}
.dl{display:block;white-space:pre;font:14px/1.45 Consolas,monospace;padding:0 6px}
.dl.ok{background:var(--okbg)} .dl.bad{background:var(--badbg)} .dl.miss{background:var(--warnbg)}
.tick{display:flex;gap:10px;align-items:flex-start;margin:6px 0}
.tick input{width:22px;height:22px;flex:none;margin-top:2px}
table{border-collapse:collapse;width:100%} td,th{border:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}
.fc{min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:21px;cursor:pointer;padding:24px;white-space:pre-wrap}
.fc.back{background:var(--okbg)}
a{color:var(--ac)}
.blank{font:15px Consolas,monospace;width:auto;min-width:80px;padding:2px 6px}
.blank.ok{border-color:var(--ok);background:var(--okbg)}.blank.bad{border-color:var(--bad);background:var(--badbg)}
.cl{cursor:pointer} .cl:hover{background:var(--acbg)}
.timer{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.st0{color:var(--mut)} .st1{color:var(--ac)} .st2{color:var(--ok)}
#book{display:none}
@media print{
 header,nav,.noprint,button,section{display:none!important}
 body{background:#fff;color:#000;font-size:12pt}
 main{max-width:none;padding:0}
 body.pbook #book{display:block!important}
 body.pcheat #cheat{display:block!important}
 .k,.ty,.s,.n,.c,.p{color:#000!important} .k{font-weight:700}
 pre{background:#fff;border:1px solid #999;font-size:10pt;line-height:1.22;white-space:pre}
 .bk{break-inside:avoid;page-break-inside:avoid;border-bottom:1px dashed #999;padding:3mm 0;display:flex;gap:4mm}
 .bk>div:first-child{width:66%;flex:none} .bk>.note{flex:1}
 .bk pre{white-space:pre-wrap;font-size:9.5pt;line-height:1.18;padding:2mm 3mm;margin:1mm 0}
 .bk h4{margin:0 0 2mm;font-size:13pt} .bk .de{font-size:10.5pt;margin:0 0 2mm}
 .note{border-left:1px solid #bbb;background:repeating-linear-gradient(#fff 0,#fff 7.5mm,#ccc 7.5mm,#ccc 7.8mm)}
 .bk.long pre{font-size:8.5pt}
 .toc{columns:2;font-size:10.5pt} .toc div{break-inside:avoid}
 .pb{page-break-after:always}
 .cgrid{columns:2;column-gap:5mm}
 .cgrid .card{border:1px solid #999;break-inside:avoid;padding:1.5mm 2.5mm;margin:0 0 2mm;border-radius:2mm;font-size:9pt}
 .cgrid pre{font-size:7.8pt;line-height:1.15;white-space:pre-wrap;padding:1mm 2mm;margin:1mm 0}
 .cgrid ol{margin:0;padding-left:5mm;font-size:8pt}
}

var DATA = {"bugx": {"0|sang": 1, "3|class_sinhvien": 1, "7|ghep3_mang": 1, "7|ghep3_so": 1, "9|ptich_somu": 1}, "bai": [{"id": "nt_kiemtra", "ten": "Kiểm tra số nguyên tố", "nhom": "lts", "sao": 5, "tier": 1, "mau": ["M1", "M2"], "de": "Cho T số n (0 ≤ n ≤ 10^12). Mỗi số in YES nếu là số nguyên tố, ngược lại in NO.", "vin": "4\n2\n1\n17\n100", "meo": "Nguyên tố = chỉ chia hết cho 1 và chính nó. Thử chia từ 2 đến căn n là đủ.", "desai": "Viết i <= n sẽ chạy quá thời gian (TLE). Dùng int cho n lớn sẽ tràn số.", "gd": "Giả định có T bộ test. Đề không có T thì xóa 3 dòng int t; cin >> t; while (t--). Đề in \"Yes\" thì sửa đúng chữ.", "the": [["Vòng for kiểm tra nguyên tố có điều kiện gì?", "i * i <= n. Không dùng i <= n vì sẽ TLE."], ["Số 0 và 1 có phải số nguyên tố không? Code xử lý ở dòng nào?", "Không phải. Dòng if (n < 2) return false;"], ["n đến 10^12 thì n và i dùng kiểu gì?", "long long cho cả n và i, nếu không i * i bị tràn."]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nbool nt(long long n) {\n    if (n < 2) return false;\n    for (long long i = 2; i * i <= n; i++)\n        if (n % i == 0) return false;\n    return true;\n}\n\nint main() {\n    int t;\n    cin >> t;\n    while (t--) {\n        long long n;\n        cin >> n;\n        if (nt(n)) cout << \"YES\" << endl;\n        else cout << \"NO\" << endl;\n    }\n    return 0;\n}", "vout": "YES\nNO\nYES\nNO", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (100 số 999999999989 (nguyên tố gần 10^12)): 0.27 giây trên máy test", "base": null}, {"id": "sang", "ten": "Sàng: liệt kê số nguyên tố ≤ n", "nhom": "lts", "sao": 5, "tier": 1, "mau": ["M6"], "de": "Cho n (1 ≤ n ≤ 10^7). In các số nguyên tố từ 2 đến n trên một dòng, cách nhau 1 dấu cách.", "vin": "20", "meo": "Đánh dấu tất cả là nguyên tố, rồi gạch các bội của từng số nguyên tố i, bắt đầu từ i * i.", "desai": "Khai báo mảng 10^7 trong main sẽ bị crash, phải khai báo ngoài main. Vòng j bắt đầu từ i * i, cộng thêm i mỗi lần.", "gd": "Không có T. Đề yêu cầu mỗi số một dòng thì thay cout << \" \" bằng endl.", "the": [["Mảng p[10000001] khai báo ở đâu?", "Ngoài main, vì mảng lớn trong main sẽ tràn bộ nhớ stack."], ["Vòng gạch bội: j bắt đầu từ đâu, tăng bao nhiêu?", "j = i * i; j <= n; j += i"], ["Làm sao in không thừa dấu cách cuối dòng?", "Trước mỗi số: if (dem > 0) cout << \" \";"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nbool p[10000001];\n\nint main() {\n    int n;\n    cin >> n;\n    for (int i = 2; i <= n; i++) p[i] = true;\n    for (int i = 2; (long long)i * i <= n; i++)\n        if (p[i])\n            for (int j = i * i; j <= n; j += i) p[j] = false;\n    int dem = 0;\n    for (int i = 2; i <= n; i++)\n        if (p[i]) {\n            if (dem > 0) cout << \" \";\n            cout << i;\n            dem++;\n        }\n    cout << endl;\n    return 0;\n}", "vout": "2 3 5 7 11 13 17 19", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 304 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (n = 10^7): 0.09 giây trên máy test", "base": null}, {"id": "uoc", "ten": "Số ước và tổng ước", "nhom": "lts", "sao": 5, "tier": 1, "mau": ["M3"], "de": "T bộ test, mỗi bộ cho n (1 ≤ n ≤ 10^12). In số lượng ước và tổng các ước của n.", "vin": "3\n1\n6\n12", "meo": "Ước đi theo cặp (i, n / i). Duyệt i đến căn n, mỗi lần được 2 ước. Riêng số chính phương, i = n / i thì chỉ tính 1 ước.", "desai": "Quên if (i != n / i) thì số chính phương (4, 9, 36) bị đếm thừa 1 ước.", "gd": "Đề chỉ hỏi số ước thì bỏ biến tong. Đề hỏi \"tổng ước không kể n\" thì in tong - n.", "the": [["Mỗi i chia hết n cho ta mấy ước?", "Hai ước: i và n / i (trừ khi i == n / i)."], ["Số chính phương bị sai ở đâu nếu quên kiểm tra?", "Đếm i hai lần. Phải có if (i != n / i)."], ["Biến tong dùng kiểu gì khi n = 10^12?", "long long"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    int t;\n    cin >> t;\n    while (t--) {\n        long long n;\n        cin >> n;\n        long long dem = 0, tong = 0;\n        for (long long i = 1; i * i <= n; i++)\n            if (n % i == 0) {\n                dem++;\n                tong += i;\n                if (i != n / i) {\n                    dem++;\n                    tong += n / i;\n                }\n            }\n        cout << dem << \" \" << tong << endl;\n    }\n    return 0;\n}", "vout": "1 1\n4 12\n6 28", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (100 số gần 10^12): 0.26 giây trên máy test", "base": null}, {"id": "ucln_bcnn", "ten": "UCLN và BCNN của hai số", "nhom": "lts", "sao": 5, "tier": 1, "mau": ["M4"], "de": "T bộ test, mỗi bộ cho a, b (1 ≤ a, b ≤ 10^9). In UCLN và BCNN.", "vin": "2\n12 18\n7 5", "meo": "Euclid: chia lấy dư mãi, đến khi b = 0 thì a là UCLN. BCNN = a / UCLN * b.", "desai": "Viết a * b / g có thể tràn số. Phải chia trước: a / g * b. Dùng long long.", "gd": "a, b đến 10^18 thì BCNN có thể vượt long long. Đề khi đó thường cho kết quả nhỏ hơn 10^18.", "the": [["4 dòng trong vòng while của ucln?", "r = a % b; a = b; b = r; (lặp khi b != 0)"], ["Công thức BCNN không tràn số?", "a / ucln(a, b) * b (chia trước, nhân sau)"], ["Kiểu dữ liệu cho BCNN của hai số 10^9?", "long long (kết quả có thể đến 10^18)"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nlong long ucln(long long a, long long b) {\n    while (b != 0) {\n        long long r = a % b;\n        a = b;\n        b = r;\n    }\n    return a;\n}\n\nint main() {\n    int t;\n    cin >> t;\n    while (t--) {\n        long long a, b;\n        cin >> a >> b;\n        long long g = ucln(a, b);\n        cout << g << \" \" << a / g * b << endl;\n    }\n    return 0;\n}", "vout": "6 36\n1 35", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (10^5 cặp số 10^9): 0.13 giây trên máy test", "base": null}, {"id": "chu_so", "ten": "Tổng chữ số, số đảo, thuận nghịch", "nhom": "lts", "sao": 5, "tier": 1, "mau": ["M5"], "de": "T bộ test, mỗi bộ cho n (1 ≤ n ≤ 10^18). In tổng chữ số, số đảo, và YES/NO cho biết n có phải số thuận nghịch không.", "vin": "3\n123\n121\n10", "meo": "% 10 lấy chữ số cuối, / 10 bỏ chữ số cuối. Số đảo: res = res * 10 + chữ số. Thuận nghịch nghĩa là dao(n) == n.", "desai": "Tách chữ số trực tiếp trên n thì n về 0 mất. Phải chép ra biến x trước. Số đảo của 10 là 1.", "gd": "Đề chỉ hỏi một trong ba yêu cầu thì xóa bớt phần còn lại.", "the": [["Lấy chữ số cuối và bỏ chữ số cuối của n?", "n % 10 và n /= 10"], ["Công thức tạo số đảo?", "res = res * 10 + n % 10"], ["Vì sao phải dùng biến x = n khi tính tổng chữ số?", "Vòng while làm n về 0, sau đó còn cần n để so sánh."]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nlong long dao(long long n) {\n    long long res = 0;\n    while (n > 0) {\n        res = res * 10 + n % 10;\n        n /= 10;\n    }\n    return res;\n}\n\nint main() {\n    int t;\n    cin >> t;\n    while (t--) {\n        long long n;\n        cin >> n;\n        long long tong = 0, x = n;\n        while (x > 0) {\n            tong += x % 10;\n            x /= 10;\n        }\n        cout << tong << \" \" << dao(n) << \" \";\n        if (dao(n) == n) cout << \"YES\" << endl;\n        else cout << \"NO\" << endl;\n    }\n    return 0;\n}", "vout": "6 321 NO\n4 121 YES\n1 1 NO", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (10^5 số 18 chữ số): 0.12 giây trên máy test", "base": null}, {"id": "ptich_somu", "ten": "Phân tích thừa số, sắp xếp theo số mũ giảm dần", "nhom": "lts", "sao": 5, "tier": 1, "mau": ["M3", "M7"], "de": "Cho n (2 ≤ n ≤ 10^12). Phân tích n ra thừa số nguyên tố, sắp xếp theo số mũ giảm dần, cùng số mũ thì cơ số lớn đứng trước. In dạng p^e, cách nhau 1 dấu cách. (Đề kỳ trước)", "vin": "360", "meo": "Duyệt i đến căn n, chia n cho i đến khi không chia được nữa, đếm số mũ. Lưu (cơ số, mũ) vào vector pair, rồi sort bằng cmp.", "desai": "Quên if (n > 1) ở cuối thì mất thừa số lớn còn lại (ví dụ 999999999989). Viết vector<pair<long long, int>> thiếu dấu cách thì lỗi biên dịch trên C++98.", "gd": "Định dạng in giả định là \"2^3 3^2 5^1\". Nếu đề in \"2^3 * 3^2\" thì sửa dòng if (i > 0) cout << \" \"; thành \" * \". Nếu đề in \"2 3\" (cơ số rồi mũ) thì sửa \"^\" thành \" \". Nếu có T bộ test thì bọc while (t--) và khai báo vector bên trong.", "the": [["Sau vòng for, vì sao cần if (n > 1)?", "Phần n còn lại là một số nguyên tố lớn hơn căn n, mũ 1."], ["cmp cho \"mũ giảm dần, cùng mũ thì cơ số lớn trước\"?", "if (a.second != b.second) return a.second > b.second; return a.first > b.first;"], ["Khai báo vector chứa cặp (cơ số, mũ) cho C++98?", "vector<pair<long long, int> > a;  (có dấu cách giữa > >)"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nbool cmp(pair<long long, int> a, pair<long long, int> b) {\n    if (a.second != b.second) return a.second > b.second;\n    return a.first > b.first;\n}\n\nint main() {\n    long long n;\n    cin >> n;\n    vector<pair<long long, int> > a;\n    for (long long i = 2; i * i <= n; i++) {\n        int dem = 0;\n        while (n % i == 0) {\n            n /= i;\n            dem++;\n        }\n        if (dem > 0) a.push_back(make_pair(i, dem));\n    }\n    if (n > 1) a.push_back(make_pair(n, 1));\n    sort(a.begin(), a.end(), cmp);\n    for (int i = 0; i < (int)a.size(); i++) {\n        if (i > 0) cout << \" \";\n        cout << a[i].first << \"^\" << a[i].second;\n    }\n    cout << endl;\n    return 0;\n}", "vout": "2^3 3^2 5^1", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 306 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (n = 999999999989): 0.01 giây trên máy test", "base": null}, {"id": "uoc_nt_max", "ten": "Ước nguyên tố lớn nhất", "nhom": "lts", "sao": 5, "tier": 1, "mau": ["M3"], "de": "T bộ test, mỗi bộ cho n (2 ≤ n ≤ 10^12). In ước nguyên tố lớn nhất của n.", "vin": "3\n10\n17\n600851475143", "meo": "Phân tích thừa số như bình thường, mỗi lần chia được thì res = i. Cuối cùng nếu n > 1 thì res = n.", "desai": "Quên if (n > 1) res = n; thì số nguyên tố như 17 in sai ra 1.", "gd": "Đề hỏi \"ước nguyên tố nhỏ nhất\" thì đó chính là i đầu tiên chia hết n (nếu không có thì là n).", "the": [["Ước nguyên tố lớn nhất lấy ở đâu sau vòng for?", "Nếu n > 1 thì chính là n còn lại, nếu không là i cuối cùng chia được."], ["Kết quả với n = 17?", "17 (nhờ dòng if (n > 1) res = n;)"], ["Vòng for ở đây dùng điều kiện gì?", "i * i <= n với long long"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    int t;\n    cin >> t;\n    while (t--) {\n        long long n;\n        cin >> n;\n        long long res = 1;\n        for (long long i = 2; i * i <= n; i++)\n            while (n % i == 0) {\n                res = i;\n                n /= i;\n            }\n        if (n > 1) res = n;\n        cout << res << endl;\n    }\n    return 0;\n}", "vout": "5\n17\n6857", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (100 số nguyên tố gần 10^12): 0.27 giây trên máy test", "base": null}, {"id": "sx_nt_mang", "ten": "Sắp xếp các số nguyên tố trong mảng (số khác giữ nguyên)", "nhom": "lts", "sao": 5, "tier": 1, "mau": ["M2", "M7"], "de": "Cho n, rồi n số. Sắp xếp tăng dần các số nguyên tố, các số không nguyên tố giữ nguyên vị trí. In mảng kết quả.", "vin": "6\n7 4 3 9 2 5", "meo": "Lấy các số nguyên tố ra vector b, sort b. Duyệt lại mảng a, gặp số nguyên tố thì lần lượt thay bằng b[j++].", "desai": "Gọi nt(a[i]) sau khi đã gán a[i] = b[j] vẫn đúng, vì b[j] cũng là số nguyên tố. Nhưng không được sort cả mảng a.", "gd": "Đề yêu cầu giảm dần thì đổi sort(b.begin(), b.end()) thành sort(b.rbegin(), b.rend()).", "the": [["Ý tưởng sắp xếp riêng các số nguyên tố?", "Lấy ra b, sort b, rồi đặt lại vào đúng chỗ của các số nguyên tố theo thứ tự."], ["Biến j dùng để làm gì?", "Chỉ số trong b của số nguyên tố tiếp theo cần đặt vào: a[i] = b[j++]."], ["Sắp xếp giảm dần bằng sort thế nào?", "sort(b.rbegin(), b.rend())"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nbool nt(long long n) {\n    if (n < 2) return false;\n    for (long long i = 2; i * i <= n; i++)\n        if (n % i == 0) return false;\n    return true;\n}\n\nint main() {\n    int n;\n    cin >> n;\n    vector<long long> a(n), b;\n    for (int i = 0; i < n; i++) {\n        cin >> a[i];\n        if (nt(a[i])) b.push_back(a[i]);\n    }\n    sort(b.begin(), b.end());\n    int j = 0;\n    for (int i = 0; i < n; i++) {\n        if (nt(a[i])) a[i] = b[j++];\n        if (i > 0) cout << \" \";\n        cout << a[i];\n    }\n    cout << endl;\n    return 0;\n}", "vout": "2 4 3 9 5 7", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 303 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (n = 10^5, a[i] = 999983): 0.55 giây trên máy test", "base": null}, {"id": "fibo", "ten": "Fibonacci thứ n (n ≤ 92)", "nhom": "lts", "sao": 5, "tier": 1, "mau": ["M1"], "de": "T bộ test, mỗi bộ cho n (0 ≤ n ≤ 92). In F(n), với F(0) = 0, F(1) = 1, F(n) = F(n-1) + F(n-2).", "vin": "3\n0\n10\n92", "meo": "Tính sẵn f[0..92] một lần trước vòng T, mỗi bộ test chỉ việc in f[n].", "desai": "Dùng int thì tràn từ F(47). F(92) là số lớn nhất vừa long long.", "gd": "Nếu đề cho F(1) = F(2) = 1 (đếm từ 1) thì kết quả giống hệt. Nếu đề cho F(0) = 1 thì in f[n + 1].", "the": [["Fibonacci đến n = 92 dùng kiểu gì?", "long long (int tràn từ F(47))"], ["Vì sao tính f trước vòng while (t--)?", "Chỉ tính một lần, mỗi test in luôn f[n], rất nhanh."], ["Công thức f[i]?", "f[i] = f[i - 1] + f[i - 2], với f[0] = 0, f[1] = 1"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nlong long f[100];\n\nint main() {\n    f[0] = 0;\n    f[1] = 1;\n    for (int i = 2; i <= 92; i++) f[i] = f[i - 1] + f[i - 2];\n    int t;\n    cin >> t;\n    while (t--) {\n        int n;\n        cin >> n;\n        cout << f[n] << endl;\n    }\n    return 0;\n}", "vout": "0\n55\n7540113804746346429", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (10^5 truy vấn): 0.06 giây trên máy test", "base": null}, {"id": "doi56_tong", "ten": "Đổi 5 ↔ 6: tổng nhỏ nhất và lớn nhất của 2 số", "nhom": "lts", "sao": 5, "tier": 1, "mau": ["M5"], "de": "Cho x, y. Được đổi chữ số 5 thành 6 hoặc 6 thành 5. In tổng nhỏ nhất (mọi 6 thành 5) và tổng lớn nhất (mọi 5 thành 6).", "vin": "11 25", "meo": "Đọc vào string. Nhỏ nhất: đổi hết 6 thành 5. Lớn nhất: đổi hết 5 thành 6. Hàm doi(s, cũ, mới) dùng chung.", "desai": "Đọc bằng số rồi tách chữ số rất rối. Đọc string là dễ nhất. Chữ số chuyển thành số: s[i] - '0'.", "gd": "Giả định 1 bộ test, in \"min max\". Đề có T thì bọc while (t--). Đề in max trước thì đổi chỗ 2 biến.", "the": [["Tổng nhỏ nhất thì đổi gì thành gì?", "Mọi chữ số 6 thành 5"], ["Chuyển string số thành long long?", "res = res * 10 + (s[i] - '0')"], ["Vì sao truyền string s (không có &) vào hàm doi?", "Để sửa trên bản sao, s gốc giữ nguyên cho lần gọi sau."]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nlong long doi(string s, char a, char b) {\n    for (int i = 0; i < (int)s.size(); i++)\n        if (s[i] == a) s[i] = b;\n    long long res = 0;\n    for (int i = 0; i < (int)s.size(); i++)\n        res = res * 10 + (s[i] - '0');\n    return res;\n}\n\nint main() {\n    string x, y;\n    cin >> x >> y;\n    long long mn = doi(x, '6', '5') + doi(y, '6', '5');\n    long long mx = doi(x, '5', '6') + doi(y, '5', '6');\n    cout << mn << \" \" << mx << endl;\n    return 0;\n}", "vout": "36 37", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 303 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (số 18 chữ số): 0.00 giây trên máy test", "base": null}, {"id": "ghep3_so", "ten": "Ghép 3 chữ số đầu + 3 chữ số cuối, kiểm tra nguyên tố", "nhom": "lts", "sao": 5, "tier": 1, "mau": ["M2", "M5"], "de": "T bộ test, mỗi bộ cho một số n có ít nhất 6 chữ số. Ghép 3 chữ số đầu và 3 chữ số cuối thành một số 6 chữ số, in YES nếu số đó nguyên tố.", "vin": "2\n1234567\n100000", "meo": "Đọc n vào string s. substr(0, 3) lấy 3 ký tự đầu, substr(n - 3, 3) lấy 3 ký tự cuối. Đổi thành số rồi gọi nt.", "desai": "substr(vị trí, độ dài), tham số thứ hai là độ dài chứ không phải vị trí cuối. Số ghép có thể có số 0 ở đầu (000002 = 2).", "gd": "Giả định n có ít nhất 6 chữ số. Nếu đề muốn in cả số ghép thì thêm cout << res. Cách hiểu theo mảng xem bài tiếp theo.", "the": [["Lấy 3 ký tự cuối của s (độ dài n)?", "s.substr(n - 3, 3)"], ["Tham số thứ 2 của substr là gì?", "Độ dài đoạn cần lấy"], ["Ghép \"123\" và \"567\" thành số?", "Nối x = \"123567\" rồi res = res * 10 + (x[i] - '0')"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nbool nt(long long n) {\n    if (n < 2) return false;\n    for (long long i = 2; i * i <= n; i++)\n        if (n % i == 0) return false;\n    return true;\n}\n\nint main() {\n    int t;\n    cin >> t;\n    while (t--) {\n        string s;\n        cin >> s;\n        int n = s.size();\n        string x = s.substr(0, 3) + s.substr(n - 3, 3);\n        long long res = 0;\n        for (int i = 0; i < 6; i++) res = res * 10 + (x[i] - '0');\n        if (nt(res)) cout << \"YES\" << endl;\n        else cout << \"NO\" << endl;\n    }\n    return 0;\n}", "vout": "NO\nNO", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (10^5 số 18 chữ số): 0.10 giây trên máy test", "base": null}, {"id": "nt_dungmot", "ten": "Đúng một trong hai số là nguyên tố", "nhom": "lts", "sao": 5, "tier": 3, "base": "nt_kiemtra", "mau": ["M2"], "de": "T bộ test, mỗi bộ có 2 số a, b. In YES nếu đúng một trong hai số là số nguyên tố, ngược lại in NO.", "vin": "3\n2 4\n2 3\n4 6", "meo": "\"Đúng một\" nghĩa là kết quả nt(a) khác nt(b), nên viết nt(a) != nt(b).", "desai": "Dùng || thì sai khi cả hai đều nguyên tố. Phải dùng !=.", "gd": "Đề hỏi \"cả hai\" thì dùng &&, đề hỏi \"ít nhất một\" thì dùng ||.", "the": [["Điều kiện \"đúng một trong hai số nguyên tố\"?", "nt(a) != nt(b)"], ["Điều kiện \"cả hai đều nguyên tố\"?", "nt(a) && nt(b)"], ["Điều kiện \"ít nhất một số nguyên tố\"?", "nt(a) || nt(b)"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nbool nt(long long n) {\n    if (n < 2) return false;\n    for (long long i = 2; i * i <= n; i++)\n        if (n % i == 0) return false;\n    return true;\n}\n\nint main() {\n    int t;\n    cin >> t;\n    while (t--) {\n        long long a, b;\n        cin >> a >> b;\n        if (nt(a) != nt(b)) cout << \"YES\" << endl;\n        else cout << \"NO\" << endl;\n    }\n    return 0;\n}", "vout": "YES\nNO\nNO", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (50 cặp nguyên tố gần 10^12): 0.27 giây trên máy test"}, {"id": "ptich_tang", "ten": "Phân tích thừa số (cơ số tăng dần)", "nhom": "lts", "sao": 5, "tier": 3, "base": "ptich_somu", "mau": ["M3"], "de": "Cho n (2 ≤ n ≤ 10^12). In phân tích thừa số nguyên tố theo cơ số tăng dần, dạng p^e nối với nhau bằng \" * \".", "vin": "360", "meo": "Không cần sort: duyệt i tăng dần thì cơ số đã tăng sẵn. Biến dau = 1 đánh dấu \"chưa in gì\".", "desai": "Quên phần n > 1. In thừa \" * \" ở đầu: dùng biến dau để biết đã in gì chưa.", "gd": "Định dạng giả định \"2^3 * 3^2 * 5^1\". Đổi \" * \" thành \" \" nếu đề khác.", "the": [["Vì sao phân tích tăng dần không cần sort?", "Vòng i chạy tăng dần, nên thừa số tìm được đã theo thứ tự tăng."], ["Biến dau dùng để làm gì?", "Để không in \" * \" trước thừa số đầu tiên."], ["Vòng while bên trong làm gì?", "while (n % i == 0) { n /= i; dem++; }: đếm số mũ của i."]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    long long n;\n    cin >> n;\n    int dau = 1;\n    for (long long i = 2; i * i <= n; i++) {\n        int dem = 0;\n        while (n % i == 0) {\n            n /= i;\n            dem++;\n        }\n        if (dem > 0) {\n            if (!dau) cout << \" * \";\n            cout << i << \"^\" << dem;\n            dau = 0;\n        }\n    }\n    if (n > 1) {\n        if (!dau) cout << \" * \";\n        cout << n << \"^\" << 1;\n    }\n    cout << endl;\n    return 0;\n}", "vout": "2^3 * 3^2 * 5^1", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 304 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (n = 999999999989): 0.01 giây trên máy test"}, {"id": "struct_thisinh", "ten": "Struct thí sinh: sắp xếp theo tổng điểm", "nhom": "class", "sao": 5, "tier": 1, "mau": ["M7", "M8"], "de": "Cho n thí sinh, mỗi thí sinh có 3 dòng: mã, họ tên (có dấu cách), 3 điểm. Sắp xếp theo tổng điểm giảm dần, bằng nhau thì mã tăng dần. In: mã, tên, tổng (1 chữ số thập phân).", "vin": "3\nTS01\nNguyen Van A\n8 9 7.5\nTS02\nTran Thi B\n9 9 9\nTS03\nLe C\n8 9 7.5", "meo": "struct gom các trường lại, có dấu ; sau }. Đọc tên bằng getline(cin >> ws, ...). cmp 2 tiêu chí, rồi sort.", "desai": "Thiếu dấu ; sau } của struct gây lỗi biên dịch. Thiếu cin >> ws thì tên bị rỗng. Quên fixed << setprecision(1).", "gd": "Định dạng in giả định \"mã tên tổng\". Đề có thêm trường (ngày sinh, lớp) thì thêm biến vào struct và in ra. Muốn in 2 chữ số thập phân thì sửa setprecision(2).", "the": [["Struct kết thúc bằng gì?", "}; (có dấu chấm phẩy)"], ["Đọc họ tên sau khi vừa cin >> ma?", "getline(cin >> ws, a[i].ten);"], ["In số thực 1 chữ số thập phân?", "cout << fixed << setprecision(1) << x;"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nstruct ThiSinh {\n    string ma, ten;\n    double tong;\n};\n\nbool cmp(ThiSinh a, ThiSinh b) {\n    if (a.tong != b.tong) return a.tong > b.tong;\n    return a.ma < b.ma;\n}\n\nint main() {\n    int n;\n    cin >> n;\n    vector<ThiSinh> a(n);\n    for (int i = 0; i < n; i++) {\n        double x, y, z;\n        cin >> a[i].ma;\n        getline(cin >> ws, a[i].ten);\n        cin >> x >> y >> z;\n        a[i].tong = x + y + z;\n    }\n    sort(a.begin(), a.end(), cmp);\n    for (int i = 0; i < n; i++)\n        cout << a[i].ma << \" \" << a[i].ten << \" \" << fixed\n             << setprecision(1) << a[i].tong << endl;\n    return 0;\n}", "vout": "TS02 Tran Thi B 27.0\nTS01 Nguyen Van A 24.5\nTS03 Le C 24.5", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (n = 10^5): 0.20 giây trên máy test", "base": null}, {"id": "class_sinhvien", "ten": "Class sinh viên: nhap / xuat / getter, chuẩn hóa ngày sinh", "nhom": "class", "sao": 5, "tier": 1, "mau": ["M8", "M10"], "de": "Nhập 1 sinh viên: họ tên (1 dòng), lớp, ngày sinh (dạng d/m/yyyy, có thể thiếu số 0), GPA. In: mã B20DCCN001, tên, lớp, ngày sinh dạng dd/mm/yyyy, GPA (2 chữ số thập phân).", "vin": "Nguyen Van A\nD20CQCN01-B\n2/12/2002\n3.5", "meo": "Biến để private, hàm nhap/xuat để public. Ngày sinh: nếu ns[1] == '/' thì thêm \"0\" vào đầu; sau đó nếu ns[4] == '/' thì chèn \"0\" vào vị trí 3.", "desai": "Quên public: thì main không gọi được nhap() (lỗi biên dịch). Thiếu ; sau } của class.", "gd": "Mã \"B20DCCN001\" là giả định theo bài kiểu code.ptit. Đề cho mã khác thì sửa chuỗi trong xuat(). getTen() là ví dụ getter: getter là hàm trả về giá trị của biến private.", "the": [["Biến trong class mặc định là gì?", "private. Phải viết public: trước các hàm muốn gọi từ main."], ["Chuẩn hóa \"2/12/2002\" thành \"02/12/2002\"?", "if (ns[1] == '/') ns = \"0\" + ns;"], ["Getter là gì?", "Hàm public trả về giá trị biến private, ví dụ string getTen() { return ten; }"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nclass SinhVien {\n    string ten, lop, ns;\n    double gpa;\npublic:\n    void nhap() {\n        getline(cin >> ws, ten);\n        cin >> lop >> ns >> gpa;\n        if (ns[1] == '/') ns = \"0\" + ns;\n        if (ns[4] == '/') ns.insert(3, \"0\");\n    }\n    string getTen() { return ten; }\n    void xuat() {\n        cout << \"B20DCCN001 \" << ten << \" \" << lop << \" \" << ns\n             << \" \" << fixed << setprecision(2) << gpa << endl;\n    }\n};\n\nint main() {\n    SinhVien a;\n    a.nhap();\n    a.xuat();\n    return 0;\n}", "vout": "B20DCCN001 Nguyen Van A D20CQCN01-B 02/12/2002 3.50", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (1 sinh viên): 0.00 giây trên máy test", "base": null}, {"id": "friend_sinhvien", "ten": "Class có hàm bạn: nạp chồng >> và <<, danh sách", "nhom": "class", "sao": 5, "tier": 1, "mau": ["M10"], "de": "Nhập n sinh viên, mỗi sinh viên gồm họ tên, lớp, GPA. Mã tự sinh SV01, SV02, ... In danh sách theo thứ tự nhập: mã, tên, lớp, GPA (2 chữ số thập phân).", "vin": "2\nNguyen Van A\nD20CN1\n3.2\nTran B\nD20CN2\n2.75", "meo": "friend istream& operator>>(istream& in, SinhVien& a) có dấu & ở cả 2 chỗ, cuối hàm return in. Tương tự với ostream và out.", "desai": "Thiếu & ở SinhVien& a thì nhập xong dữ liệu mất hết. Quên return in; / return out;. Thiếu getline(in >> ws, ...).", "gd": "Mã giả định \"SV\" + 2 chữ số. Đề dùng \"B20DCCN001\" thì sửa hàm setMa. Đề muốn sắp xếp thì thêm cmp và sort như bài struct.", "the": [["Dòng khai báo nạp chồng >>?", "friend istream& operator>>(istream& in, SinhVien& a)"], ["Dòng khai báo nạp chồng <<?", "friend ostream& operator<<(ostream& out, SinhVien a)"], ["Bên trong operator>> đọc tên thế nào?", "getline(in >> ws, a.ten);  dùng in, không dùng cin"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nclass SinhVien {\n    string ma, ten, lop;\n    double gpa;\npublic:\n    friend istream& operator>>(istream& in, SinhVien& a) {\n        getline(in >> ws, a.ten);\n        in >> a.lop >> a.gpa;\n        return in;\n    }\n    friend ostream& operator<<(ostream& out, SinhVien a) {\n        out << a.ma << \" \" << a.ten << \" \" << a.lop << \" \"\n            << fixed << setprecision(2) << a.gpa;\n        return out;\n    }\n    void setMa(int i) {\n        stringstream ss;\n        ss << i;\n        ma = \"SV\" + ss.str();\n        if (i < 10) ma = \"SV0\" + ss.str();\n    }\n};\n\nint main() {\n    int n;\n    cin >> n;\n    vector<SinhVien> a(n);\n    for (int i = 0; i < n; i++) {\n        cin >> a[i];\n        a[i].setMa(i + 1);\n    }\n    for (int i = 0; i < n; i++) cout << a[i] << endl;\n    return 0;\n}", "vout": "SV01 Nguyen Van A D20CN1 3.20\nSV02 Tran B D20CN2 2.75", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 300 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (n = 99): 0.00 giây trên máy test", "base": null}, {"id": "so_phuc", "ten": "Số phức: friend operator+ và operator*", "nhom": "class", "sao": 5, "tier": 1, "mau": ["M10"], "de": "T bộ test, mỗi bộ cho a b c d, tức A = a + bi, B = c + di. Tính C = (A + B) * A và D = (A + B) * (A + B). In \"C, D\".", "vin": "1\n1 2 3 4", "meo": "Cộng: thực cộng thực, ảo cộng ảo. Nhân: (a+bi)(c+di) = (ac - bd) + (ad + bc)i.", "desai": "Công thức nhân phần thực là ac MINUS bd. Phần ảo âm in \"-\", không in \"+ -\".", "gd": "Định dạng in giả định \"1 + 2i\" và với phần ảo âm là \"1 - 2i\", hai số cách nhau \", \". Nếu đề in \"1 + -2i\" thì sửa hàm operator<< thành một dòng: out << a.thuc << \" + \" << a.ao << \"i\";", "the": [["Phần thực của tích (a+bi)(c+di)?", "a*c - b*d"], ["Phần ảo của tích?", "a*d + b*c"], ["Constructor có giá trị mặc định viết thế nào?", "SoPhuc(long long a = 0, long long b = 0)"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nclass SoPhuc {\n    long long thuc, ao;\npublic:\n    SoPhuc(long long a = 0, long long b = 0) {\n        thuc = a;\n        ao = b;\n    }\n    friend SoPhuc operator+(SoPhuc a, SoPhuc b) {\n        return SoPhuc(a.thuc + b.thuc, a.ao + b.ao);\n    }\n    friend SoPhuc operator*(SoPhuc a, SoPhuc b) {\n        return SoPhuc(a.thuc * b.thuc - a.ao * b.ao,\n                      a.thuc * b.ao + a.ao * b.thuc);\n    }\n    friend ostream& operator<<(ostream& out, SoPhuc a) {\n        if (a.ao >= 0) out << a.thuc << \" + \" << a.ao << \"i\";\n        else out << a.thuc << \" - \" << -a.ao << \"i\";\n        return out;\n    }\n};\n\nint main() {\n    int t;\n    cin >> t;\n    while (t--) {\n        long long a, b, c, d;\n        cin >> a >> b >> c >> d;\n        SoPhuc A(a, b), B(c, d);\n        SoPhuc C = (A + B) * A, D = (A + B) * (A + B);\n        cout << C << \", \" << D << endl;\n    }\n    return 0;\n}", "vout": "-8 + 14i, -20 + 48i", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 302 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (10^5 bộ số 10^5): 0.22 giây trên máy test", "base": null}, {"id": "bang_luong", "ten": "Bảng lương nhân viên (friend, sắp xếp, ghi file)", "nhom": "class", "sao": 5, "tier": 2, "mau": ["M7", "M10", "M11"], "de": "Nhập n nhân viên: họ tên, lương cơ bản, số ngày công. Mã tự sinh NV01, NV02... Lương = lương cơ bản × ngày công. Sắp xếp lương giảm dần, bằng nhau thì theo mã. In ra màn hình và ghi vào file BANGLUONG.txt.", "vin": "3\nNguyen A\n200 25\nTran B\n300 20\nLe C\n250 24", "meo": "Ghép 3 mẫu: class có friend >> <<, cmp + sort, ofstream. Một vòng for vừa cout vừa fout.", "desai": "Quên fout.close(). Viết sai tên file so với đề.", "gd": "Tên file và công thức lương là giả định. Đề có phụ cấp, thưởng thì sửa dòng a.luong = ... Đề không yêu cầu file thì xóa 3 dòng fout.", "the": [["Ghi cùng nội dung ra màn hình và file?", "cout << a[i] << endl; fout << a[i] << endl;"], ["Toán tử << tự viết có dùng được cho fout không?", "Có, vì ofstream cũng là ostream."], ["Mã NV01 tạo thế nào?", "\"NV\" + (char)('0' + (i+1)/10) + (char)('0' + (i+1)%10)"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nclass NhanVien {\npublic:\n    string ma, ten;\n    long long luong;\n    friend istream& operator>>(istream& in, NhanVien& a) {\n        long long lcb, ngay;\n        getline(in >> ws, a.ten);\n        in >> lcb >> ngay;\n        a.luong = lcb * ngay;\n        return in;\n    }\n    friend ostream& operator<<(ostream& out, NhanVien a) {\n        out << a.ma << \" \" << a.ten << \" \" << a.luong;\n        return out;\n    }\n};\n\nbool cmp(NhanVien a, NhanVien b) {\n    if (a.luong != b.luong) return a.luong > b.luong;\n    return a.ma < b.ma;\n}\n\nint main() {\n    int n;\n    cin >> n;\n    vector<NhanVien> a(n);\n    for (int i = 0; i < n; i++) {\n        cin >> a[i];\n        a[i].ma = \"NV\";\n        a[i].ma += (char)('0' + (i + 1) / 10);\n        a[i].ma += (char)('0' + (i + 1) % 10);\n    }\n    sort(a.begin(), a.end(), cmp);\n    ofstream fout(\"BANGLUONG.txt\");\n    for (int i = 0; i < n; i++) {\n        cout << a[i] << endl;\n        fout << a[i] << endl;\n    }\n    fout.close();\n    return 0;\n}", "vout": "NV02 Tran B 6000\nNV03 Le C 6000\nNV01 Nguyen A 5000", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 300 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (n = 99): 0.00 giây trên máy test", "base": null}, {"id": "tan_suat_xau", "ten": "Sắp xếp ký tự theo số lần xuất hiện (in xâu)", "nhom": "chuoi", "sao": 5, "tier": 1, "mau": ["M7"], "de": "Cho xâu s (không có dấu cách). Sắp xếp các ký tự theo số lần xuất hiện giảm dần, bằng nhau thì ký tự đứng trước trong bảng chữ cái lên trước. In xâu kết quả. (Đề kỳ trước)", "vin": "tree", "meo": "Đếm dem[ký tự], rồi sort chính xâu s bằng cmp: nhiều hơn đứng trước, bằng nhau thì ký tự nhỏ hơn đứng trước.", "desai": "Mảng dem phải khai báo ngoài main để hàm cmp dùng được. Ép (unsigned char) để chỉ số không bị âm.", "gd": "Giả định in cả xâu đã sắp xếp. Nếu đề in \"ký tự số_lần\" thì xem bài tiếp theo. Nếu xâu có dấu cách thì đọc bằng getline(cin, s).", "the": [["Vì sao mảng dem khai báo ngoài main?", "Để hàm cmp (nằm ngoài main) dùng được."], ["cmp cho \"số lần giảm, bằng thì ký tự tăng\"?", "if (x != y) return x > y; return a < b;"], ["Sort một string được không?", "Được: sort(s.begin(), s.end(), cmp);"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nint dem[256];\n\nbool cmp(char a, char b) {\n    int x = dem[(unsigned char)a], y = dem[(unsigned char)b];\n    if (x != y) return x > y;\n    return a < b;\n}\n\nint main() {\n    string s;\n    cin >> s;\n    for (int i = 0; i < (int)s.size(); i++)\n        dem[(unsigned char)s[i]]++;\n    sort(s.begin(), s.end(), cmp);\n    cout << s << endl;\n    return 0;\n}", "vout": "eert", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 303 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (xâu 10^6 ký tự): 0.07 giây trên máy test", "base": null}, {"id": "bit1_chuoi", "ten": "Dãy bit 1 liên tiếp dài nhất (xâu 0/1)", "nhom": "chuoi", "sao": 5, "tier": 1, "mau": ["M1"], "de": "T bộ test, mỗi bộ cho xâu gồm 0 và 1. In độ dài dãy 1 liên tiếp dài nhất.", "vin": "3\n1101110\n0000\n1", "meo": "Gặp 1 thì dem++, gặp 0 thì dem = 0. Sau mỗi ký tự cập nhật res = max(res, dem).", "desai": "Chỉ cập nhật res khi gặp 0 thì sai với xâu kết thúc bằng 1. Phải cập nhật sau mỗi ký tự.", "gd": "Đề hỏi dãy 0 dài nhất thì đổi '1' thành '0'.", "the": [["Hai biến cần dùng?", "dem (độ dài dãy 1 hiện tại), res (dài nhất)"], ["Gặp ký tự 0 thì làm gì?", "dem = 0"], ["Khi nào cập nhật res?", "Sau mỗi ký tự: res = max(res, dem)"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    int t;\n    cin >> t;\n    while (t--) {\n        string s;\n        cin >> s;\n        int dem = 0, res = 0;\n        for (int i = 0; i < (int)s.size(); i++) {\n            if (s[i] == '1') dem++;\n            else dem = 0;\n            res = max(res, dem);\n        }\n        cout << res << endl;\n    }\n    return 0;\n}", "vout": "3\n0\n1", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 302 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (10 xâu dài 10^5): 0.02 giây trên máy test", "base": null}, {"id": "tan_suat_dem", "ten": "Tần suất ký tự (in \"ký tự số_lần\")", "nhom": "chuoi", "sao": 5, "tier": 3, "base": "tan_suat_xau", "mau": ["M7"], "de": "Cho xâu s. In mỗi ký tự khác nhau cùng số lần xuất hiện, sắp xếp số lần giảm dần, bằng nhau thì ký tự tăng dần. Mỗi ký tự một dòng.", "vin": "banana", "meo": "Đếm, rồi đưa các cặp (số lần, ký tự) vào vector pair, sort bằng cmp.", "desai": "make_pair(dem[i], (char)i) phải ép kiểu (char).", "gd": "Nếu đề chỉ xét chữ cái thường thì dùng mảng dem[26] với dem[s[i] - 'a']. Chỉ cần thay 2 dòng.", "the": [["Kiểu vector chứa (số lần, ký tự)?", "vector<pair<int, char> > a;"], ["Thêm cặp vào vector?", "a.push_back(make_pair(dem[i], (char)i));"], ["In ra ký tự và số lần?", "a[i].second (ký tự), a[i].first (số lần)"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nbool cmp(pair<int, char> a, pair<int, char> b) {\n    if (a.first != b.first) return a.first > b.first;\n    return a.second < b.second;\n}\n\nint main() {\n    string s;\n    cin >> s;\n    int dem[256] = {0};\n    for (int i = 0; i < (int)s.size(); i++)\n        dem[(unsigned char)s[i]]++;\n    vector<pair<int, char> > a;\n    for (int i = 0; i < 256; i++)\n        if (dem[i] > 0) a.push_back(make_pair(dem[i], (char)i));\n    sort(a.begin(), a.end(), cmp);\n    for (int i = 0; i < (int)a.size(); i++)\n        cout << a[i].second << \" \" << a[i].first << endl;\n    return 0;\n}", "vout": "a 3\nn 2\nb 1", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 302 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (xâu 10^6 ký tự): 0.01 giây trên máy test"}, {"id": "dem_doan", "ten": "Đếm số nguyên tố trong đoạn [l, r]", "nhom": "lts", "sao": 4, "tier": 2, "mau": ["M6", "M12"], "de": "T truy vấn (T ≤ 10^5), mỗi truy vấn cho l, r (1 ≤ l ≤ r ≤ 10^7). In số lượng số nguyên tố trong đoạn [l, r].", "vin": "3\n1 10\n10 20\n2 2", "meo": "Sàng một lần, rồi d[i] = số lượng số nguyên tố từ 1 đến i. Kết quả = d[r] - d[l - 1].", "desai": "Mỗi truy vấn đếm lại từ đầu sẽ TLE. Nhớ l - 1.", "gd": "Nếu r chỉ đến 10^6 thì đổi N = 1000000 cho nhanh hơn.", "the": [["Công thức đếm số nguyên tố trong đoạn [l, r]?", "d[r] - d[l - 1]"], ["d[i] tính thế nào?", "d[i] = d[i - 1] + p[i] (p[i] là true/false, tương ứng 1/0)"], ["Vì sao không kiểm tra từng số bằng nt()?", "Có 10^5 truy vấn, mỗi đoạn dài, nên sẽ TLE. Sàng một lần là đủ."]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nconst int N = 10000000;\nbool p[N + 1];\nint d[N + 1];\n\nint main() {\n    for (int i = 2; i <= N; i++) p[i] = true;\n    for (int i = 2; i * i <= N; i++)\n        if (p[i])\n            for (int j = i * i; j <= N; j += i) p[j] = false;\n    for (int i = 1; i <= N; i++) d[i] = d[i - 1] + p[i];\n    int t;\n    cin >> t;\n    while (t--) {\n        int l, r;\n        cin >> l >> r;\n        if (l < 1) l = 1;\n        cout << d[r] - d[l - 1] << endl;\n    }\n    return 0;\n}", "vout": "4\n4\n1", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (sàng 10^7 + 10^5 truy vấn): 0.15 giây trên máy test", "base": null}, {"id": "luythua_mod", "ten": "Lũy thừa modulo a^b mod 10^9+7", "nhom": "lts", "sao": 4, "tier": 2, "mau": ["M1"], "de": "T bộ test, mỗi bộ cho a, b (0 ≤ a, b ≤ 10^18). In a^b mod (10^9+7).", "vin": "2\n2 10\n3 0", "meo": "Bình phương nhanh: b lẻ thì nhân a vào res, sau đó a = a * a, b chia đôi.", "desai": "Quên a %= MOD lúc đầu thì a * a bị tràn số. Mỗi phép nhân đều phải % MOD.", "gd": "MOD khác thì sửa dòng const long long MOD.", "the": [["3 dòng trong vòng while (b > 0)?", "if (b % 2 == 1) res = res * a % MOD; a = a * a % MOD; b /= 2;"], ["Vì sao cần a %= MOD trước vòng lặp?", "a đến 10^18, a * a sẽ tràn. Sau khi %, a < 10^9+7 nên a * a < 9.2*10^18, không tràn."], ["a^0 bằng bao nhiêu? Code ra bao nhiêu?", "1 (res khởi tạo bằng 1)"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nconst long long MOD = 1000000007;\n\nlong long lt(long long a, long long b) {\n    long long res = 1;\n    a %= MOD;\n    while (b > 0) {\n        if (b % 2 == 1) res = res * a % MOD;\n        a = a * a % MOD;\n        b /= 2;\n    }\n    return res;\n}\n\nint main() {\n    int t;\n    cin >> t;\n    while (t--) {\n        long long a, b;\n        cin >> a >> b;\n        cout << lt(a, b) << endl;\n    }\n    return 0;\n}", "vout": "1024\n1", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (10^5 bộ a = b = 10^18): 0.27 giây trên máy test", "base": null}, {"id": "chinh_phuong", "ten": "Số chính phương", "nhom": "lts", "sao": 4, "tier": 2, "mau": ["M1"], "de": "T bộ test, mỗi bộ cho n (0 ≤ n ≤ 10^18). In YES nếu n là số chính phương.", "vin": "3\n16\n15\n0", "meo": "x = sqrt(n), rồi chỉnh lại bằng 2 vòng while để tránh sai số, cuối cùng kiểm tra x * x == n.", "desai": "Chỉ dùng sqrt sẽ sai với số rất lớn do sai số số thực. 2 dòng while chỉnh lại là bắt buộc.", "gd": "Nếu n nhỏ (≤ 10^9) thì chỉ cần int x = sqrt(n); return x * x == n; là đủ.", "the": [["Vì sao phải có 2 vòng while sau sqrt?", "sqrt trả về số thực có sai số, nên chỉnh x lên/xuống cho đúng."], ["Điều kiện cuối cùng?", "x * x == n"], ["0 có phải số chính phương không?", "Có (0 = 0 * 0)"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nbool cp(long long n) {\n    if (n < 0) return false;\n    long long x = (long long)sqrt((double)n);\n    while (x * x > n) x--;\n    while ((x + 1) * (x + 1) <= n) x++;\n    return x * x == n;\n}\n\nint main() {\n    int t;\n    cin >> t;\n    while (t--) {\n        long long n;\n        cin >> n;\n        if (cp(n)) cout << \"YES\" << endl;\n        else cout << \"NO\" << endl;\n    }\n    return 0;\n}", "vout": "YES\nNO\nYES", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (10^5 số gần 10^18): 0.11 giây trên máy test", "base": null}, {"id": "ucln_nhieu", "ten": "UCLN và BCNN của n số", "nhom": "lts", "sao": 4, "tier": 3, "base": "ucln_bcnn", "mau": ["M4"], "de": "Cho n, rồi n số nguyên dương. In UCLN và BCNN của cả n số.", "vin": "3\n4 6 8", "meo": "Gộp dần: g = ucln(g, x) với g bắt đầu từ 0, l = BCNN(l, x) với l bắt đầu từ 1.", "desai": "Khởi tạo g = 1 sẽ luôn ra 1. Phải bắt đầu g = 0, vì ucln(0, x) = x.", "gd": "Giả định BCNN không vượt quá 10^18.", "the": [["Giá trị đầu của g khi tính UCLN nhiều số?", "g = 0, vì ucln(0, x) = x."], ["Giá trị đầu của l khi tính BCNN nhiều số?", "l = 1"], ["Cập nhật l khi đọc thêm x?", "l = l / ucln(l, x) * x;"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nlong long ucln(long long a, long long b) {\n    while (b != 0) {\n        long long r = a % b;\n        a = b;\n        b = r;\n    }\n    return a;\n}\n\nint main() {\n    int n;\n    cin >> n;\n    long long g = 0, l = 1, x;\n    for (int i = 0; i < n; i++) {\n        cin >> x;\n        g = ucln(g, x);\n        l = l / ucln(l, x) * x;\n    }\n    cout << g << \" \" << l << endl;\n    return 0;\n}", "vout": "2 24", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 302 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (n = 10^5): 0.02 giây trên máy test"}, {"id": "thuan_nghich_chuoi", "ten": "Thuận nghịch / xâu đối xứng (dạng xâu)", "nhom": "lts", "sao": 4, "tier": 3, "base": "chu_so", "mau": ["M5"], "de": "T bộ test, mỗi bộ cho một số rất lớn (đến 1000 chữ số) hoặc một xâu. In YES nếu đọc xuôi giống đọc ngược.", "vin": "3\n12321\n1234\na", "meo": "So ký tự đầu với cuối: s[i] và s[n - 1 - i], chỉ cần đi đến n / 2.", "desai": "Viết s[n - i] thì truy cập ra ngoài xâu. Phải là n - 1 - i.", "gd": "Dùng được cho cả \"xâu đối xứng\". Xâu có dấu cách thì đọc bằng getline(cin >> ws, s).", "the": [["Ký tự đối xứng với s[i] là gì?", "s[n - 1 - i]"], ["Vòng so sánh chạy đến đâu?", "i < n / 2"], ["Số có 1000 chữ số thì đọc bằng gì?", "string (long long chỉ chứa được khoảng 18 chữ số)"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nbool tn(string s) {\n    int n = s.size();\n    for (int i = 0; i < n / 2; i++)\n        if (s[i] != s[n - 1 - i]) return false;\n    return true;\n}\n\nint main() {\n    int t;\n    cin >> t;\n    while (t--) {\n        string s;\n        cin >> s;\n        if (tn(s)) cout << \"YES\" << endl;\n        else cout << \"NO\" << endl;\n    }\n    return 0;\n}", "vout": "YES\nNO\nYES", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (1000 xâu dài 1000): 0.02 giây trên máy test"}, {"id": "tong_nt_mang", "ten": "Đếm và tính tổng các số nguyên tố trong mảng", "nhom": "lts", "sao": 4, "tier": 3, "base": "nt_kiemtra", "mau": ["M2"], "de": "Cho n, rồi n số nguyên (có thể âm). In số lượng và tổng các số nguyên tố.", "vin": "5\n1 2 3 4 5", "meo": "Đọc từng số, nếu nt(x) thì dem++ và tong += x.", "desai": "Số âm không phải số nguyên tố (n < 2 trả về false, nên tự đúng).", "gd": "Đề chỉ hỏi đếm hoặc chỉ hỏi tổng thì bỏ bớt phần thừa.", "the": [["Số âm có phải số nguyên tố không?", "Không. if (n < 2) return false đã xử lý."], ["Kiểu cho tổng các số nguyên tố?", "long long"], ["Có cần lưu mảng không?", "Không. Đọc từng số x rồi xử lý luôn."]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nbool nt(long long n) {\n    if (n < 2) return false;\n    for (long long i = 2; i * i <= n; i++)\n        if (n % i == 0) return false;\n    return true;\n}\n\nint main() {\n    int n;\n    cin >> n;\n    long long tong = 0, x;\n    int dem = 0;\n    for (int i = 0; i < n; i++) {\n        cin >> x;\n        if (nt(x)) {\n            dem++;\n            tong += x;\n        }\n    }\n    cout << dem << \" \" << tong << endl;\n    return 0;\n}", "vout": "3 10", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 302 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (n = 10^5, a[i] = 999983): 0.28 giây trên máy test"}, {"id": "hoan_hao", "ten": "Số hoàn hảo", "nhom": "lts", "sao": 4, "tier": 3, "base": "uoc", "mau": ["M3"], "de": "T bộ test, mỗi bộ cho n (1 ≤ n ≤ 10^12). In YES nếu n là số hoàn hảo (tổng các ước nhỏ hơn n bằng n), ví dụ 6 = 1 + 2 + 3.", "vin": "3\n6\n28\n12", "meo": "Giống bài tổng ước, nhưng tong bắt đầu bằng 1 và i chạy từ 2 (không tính chính n).", "desai": "n = 1: tong = 1 = n nên ra YES sai. Phải có if (n < 2) return false.", "gd": "Không có.", "the": [["Vì sao tong bắt đầu bằng 1 và i chạy từ 2?", "Ước 1 tính sẵn, còn ước n (cặp với 1) không được tính."], ["Số 1 có phải số hoàn hảo không?", "Không. if (n < 2) return false;"], ["Kể 3 số hoàn hảo nhỏ nhất?", "6, 28, 496"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nbool hh(long long n) {\n    if (n < 2) return false;\n    long long tong = 1;\n    for (long long i = 2; i * i <= n; i++)\n        if (n % i == 0) {\n            tong += i;\n            if (i != n / i) tong += n / i;\n        }\n    return tong == n;\n}\n\nint main() {\n    int t;\n    cin >> t;\n    while (t--) {\n        long long n;\n        cin >> n;\n        if (hh(n)) cout << \"YES\" << endl;\n        else cout << \"NO\" << endl;\n    }\n    return 0;\n}", "vout": "YES\nYES\nNO", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (100 số gần 10^12): 0.26 giây trên máy test"}, {"id": "fibo_mod", "ten": "Fibonacci thứ n mod 10^9+7 (n lớn)", "nhom": "lts", "sao": 4, "tier": 3, "base": "fibo", "mau": ["M1"], "de": "T bộ test, mỗi bộ cho n (0 ≤ n ≤ 10^7). In F(n) mod (10^9+7).", "vin": "3\n10\n100\n1000", "meo": "Giống bài Fibonacci, nhưng mỗi bước % MOD. Mảng lớn khai báo ngoài main.", "desai": "Quên % MOD thì tràn số. Mảng 10^7 phải đặt ngoài main.", "gd": "Giả định n ≤ 10^7. Nếu n đến 10^18 cần nhân ma trận (ít khi ra trong môn này).", "the": [["Fibonacci mod: công thức?", "f[i] = (f[i - 1] + f[i - 2]) % MOD"], ["Mảng f[10^7] khai báo ở đâu?", "Ngoài main"], ["MOD viết thế nào?", "const long long MOD = 1000000007;"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nconst long long MOD = 1000000007;\nconst int N = 10000000;\nint f[N + 1];\n\nint main() {\n    f[0] = 0;\n    f[1] = 1;\n    for (int i = 2; i <= N; i++) f[i] = (f[i - 1] + f[i - 2]) % MOD;\n    int t;\n    cin >> t;\n    while (t--) {\n        int n;\n        cin >> n;\n        cout << f[n] << endl;\n    }\n    return 0;\n}", "vout": "55\n687995182\n517691607", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (n = 10^7, 10^5 truy vấn): 0.14 giây trên máy test"}, {"id": "fibo_kiemtra", "ten": "Kiểm tra n có phải số Fibonacci", "nhom": "lts", "sao": 4, "tier": 3, "base": "fibo", "mau": ["M1"], "de": "T bộ test, mỗi bộ cho n (0 ≤ n ≤ 10^18). In YES nếu n là số Fibonacci.", "vin": "3\n8\n9\n0", "meo": "Tính sẵn f[0..92], rồi kiểm tra n có trong mảng không.", "desai": "Đọc n bằng int thì sai với số lớn.", "gd": "Không có.", "the": [["Có bao nhiêu số Fibonacci nằm trong long long?", "93 số, từ f[0] đến f[92]"], ["Cách kiểm tra n có phải số Fibonacci?", "Duyệt i từ 0 đến 92, nếu f[i] == n thì YES"], ["Biến co dùng để làm gì?", "Đánh dấu đã tìm thấy n trong dãy f"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nlong long f[100];\n\nint main() {\n    f[0] = 0;\n    f[1] = 1;\n    for (int i = 2; i <= 92; i++) f[i] = f[i - 1] + f[i - 2];\n    int t;\n    cin >> t;\n    while (t--) {\n        long long n;\n        cin >> n;\n        bool co = false;\n        for (int i = 0; i <= 92; i++)\n            if (f[i] == n) co = true;\n        if (co) cout << \"YES\" << endl;\n        else cout << \"NO\" << endl;\n    }\n    return 0;\n}", "vout": "YES\nNO\nYES", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (10^5 truy vấn): 0.13 giây trên máy test"}, {"id": "doi56_mot", "ten": "Đổi 5 ↔ 6 cho một số (nhỏ nhất, lớn nhất)", "nhom": "lts", "sao": 4, "tier": 3, "base": "doi56_tong", "mau": ["M5"], "de": "T bộ test, mỗi bộ cho một số n. In số nhỏ nhất và lớn nhất có thể tạo được bằng cách đổi 5 ↔ 6.", "vin": "2\n56\n123", "meo": "Như bài 2 số nhưng gọi doi một lần cho mỗi kiểu đổi.", "desai": "Không có gì mới. Nhớ dấu nháy đơn '5' (ký tự), không phải \"5\".", "gd": "Không có.", "the": [["Ký tự 5 viết thế nào trong C++?", "'5' (nháy đơn). \"5\" là xâu."], ["Số lớn nhất: đổi gì thành gì?", "Mọi chữ số 5 thành 6"], ["Kiểu của s[i] - '0'?", "int, là giá trị chữ số 0..9"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nlong long doi(string s, char a, char b) {\n    for (int i = 0; i < (int)s.size(); i++)\n        if (s[i] == a) s[i] = b;\n    long long res = 0;\n    for (int i = 0; i < (int)s.size(); i++)\n        res = res * 10 + (s[i] - '0');\n    return res;\n}\n\nint main() {\n    int t;\n    cin >> t;\n    while (t--) {\n        string s;\n        cin >> s;\n        cout << doi(s, '6', '5') << \" \" << doi(s, '5', '6') << endl;\n    }\n    return 0;\n}", "vout": "55 66\n123 123", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (10^5 số 18 chữ số): 0.12 giây trên máy test"}, {"id": "ghep3_mang", "ten": "Ghép 3 phần tử đầu + 3 phần tử cuối của mảng, kiểm tra nguyên tố", "nhom": "lts", "sao": 4, "tier": 3, "base": "ghep3_so", "mau": ["M2"], "de": "Cho n (n ≥ 6) và mảng n chữ số (0..9). Ghép a[0] a[1] a[2] a[n-3] a[n-2] a[n-1] thành một số. In số đó, rồi in YES/NO cho biết nó có nguyên tố không.", "vin": "7\n1 2 3 9 4 5 7", "meo": "res = res * 10 + a[i] cho 3 phần tử đầu, rồi tiếp tục cho 3 phần tử cuối.", "desai": "Vòng cuối chạy i từ n - 3 đến n - 1, không phải từ n - 4.", "gd": "Giả định mỗi phần tử là 1 chữ số. Nếu phần tử nhiều chữ số thì đọc a[i] bằng string rồi nối xâu. Nếu đề không yêu cầu in số ghép thì xóa dòng cout << res.", "the": [["3 phần tử cuối có chỉ số nào?", "n - 3, n - 2, n - 1"], ["Ghép chữ số vào res?", "res = res * 10 + a[i]"], ["Kiểu của res?", "long long"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nbool nt(long long n) {\n    if (n < 2) return false;\n    for (long long i = 2; i * i <= n; i++)\n        if (n % i == 0) return false;\n    return true;\n}\n\nint main() {\n    int n;\n    cin >> n;\n    vector<int> a(n);\n    for (int i = 0; i < n; i++) cin >> a[i];\n    long long res = 0;\n    for (int i = 0; i < 3; i++) res = res * 10 + a[i];\n    for (int i = n - 3; i < n; i++) res = res * 10 + a[i];\n    cout << res << endl;\n    if (nt(res)) cout << \"YES\" << endl;\n    else cout << \"NO\" << endl;\n    return 0;\n}", "vout": "123457\nYES", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 302 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (n = 10^5): 0.01 giây trên máy test"}, {"id": "constructor_hcn", "ten": "Constructor mặc định và có tham số (hình chữ nhật)", "nhom": "class", "sao": 4, "tier": 2, "mau": ["M10"], "de": "Tạo class HCN có constructor mặc định (dài = rộng = 0) và constructor có tham số. In chu vi, diện tích của HCN mặc định, rồi của HCN đọc từ bàn phím.", "vin": "3 4", "meo": "Constructor có tên trùng tên class và không có kiểu trả về. HCN a; gọi constructor mặc định, HCN b(d, r); gọi constructor có tham số.", "desai": "Viết void HCN() là sai, constructor không có kiểu trả về. Viết HCN a(); (có ngoặc) là khai báo hàm, không phải tạo đối tượng.", "gd": "Đề là hình tròn, điểm, tam giác... thì giữ nguyên khuôn, chỉ đổi tên biến và công thức.", "the": [["Constructor khác hàm thường ở đâu?", "Tên trùng tên class, không có kiểu trả về."], ["Tạo đối tượng bằng constructor mặc định?", "HCN a;  (KHÔNG viết HCN a();)"], ["Tạo đối tượng có tham số?", "HCN b(d, r);"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nclass HCN {\n    long long dai, rong;\npublic:\n    HCN() {\n        dai = 0;\n        rong = 0;\n    }\n    HCN(long long d, long long r) {\n        dai = d;\n        rong = r;\n    }\n    long long chuVi() { return 2 * (dai + rong); }\n    long long dienTich() { return dai * rong; }\n};\n\nint main() {\n    HCN a;\n    cout << a.chuVi() << \" \" << a.dienTich() << endl;\n    long long d, r;\n    cin >> d >> r;\n    HCN b(d, r);\n    cout << b.chuVi() << \" \" << b.dienTich() << endl;\n    return 0;\n}", "vout": "0 0\n14 12", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 302 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (cạnh 10^9): 0.00 giây trên máy test", "base": null}, {"id": "phan_so", "ten": "Class phân số: rút gọn, cộng, so sánh", "nhom": "class", "sao": 4, "tier": 2, "mau": ["M4", "M10"], "de": "Cho 2 phân số p/q và r/s (mẫu khác 0, có thể âm). In tổng đã rút gọn dạng x/y (mẫu dương), rồi in <, > hoặc = khi so sánh p/q với r/s.", "vin": "1 2 1 3", "meo": "Rút gọn ngay trong constructor: mẫu âm thì đổi dấu cả tử và mẫu, rồi chia cả hai cho UCLN. Cộng: tu = a.tu * b.mau + b.tu * a.mau.", "desai": "Tử bằng 0 thì UCLN = mẫu, kết quả là 0/1 (đúng). Quên đổi dấu khi mẫu âm thì so sánh bị sai.", "gd": "Đề chỉ hỏi rút gọn thì chỉ cần constructor. Đề có trừ hoặc nhân thì viết thêm operator- hoặc operator* theo cùng khuôn.", "the": [["Tử của phân số tổng a + b?", "a.tu * b.mau + b.tu * a.mau"], ["Rút gọn phân số?", "g = ucln(tu, mau); tu /= g; mau /= g;"], ["So sánh a < b không dùng số thực?", "a.tu * b.mau < b.tu * a.mau (mẫu đã dương)"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nlong long ucln(long long a, long long b) {\n    if (a < 0) a = -a;\n    while (b != 0) {\n        long long r = a % b;\n        a = b;\n        b = r;\n    }\n    return a;\n}\n\nclass PhanSo {\npublic:\n    long long tu, mau;\n    PhanSo(long long a, long long b) {\n        tu = a;\n        mau = b;\n        if (mau < 0) { tu = -tu; mau = -mau; }\n        long long g = ucln(tu, mau);\n        tu /= g;\n        mau /= g;\n    }\n    friend PhanSo operator+(PhanSo a, PhanSo b) {\n        return PhanSo(a.tu * b.mau + b.tu * a.mau, a.mau * b.mau);\n    }\n};\n\nint main() {\n    long long p, q, r, s;\n    cin >> p >> q >> r >> s;\n    PhanSo a(p, q), b(r, s), c = a + b;\n    cout << c.tu << \"/\" << c.mau << endl;\n    if (a.tu * b.mau < b.tu * a.mau) cout << \"<\" << endl;\n    else if (a.tu * b.mau > b.tu * a.mau) cout << \">\" << endl;\n    else cout << \"=\" << endl;\n    return 0;\n}", "vout": "5/6\n>", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 303 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (tử, mẫu 10^6): 0.00 giây trên máy test", "base": null}, {"id": "file_tong_sx", "ten": "File: đọc n số, ghi tổng và dãy đã sắp xếp", "nhom": "file", "sao": 4, "tier": 1, "mau": ["M11"], "de": "File input.txt: dòng 1 là n, dòng 2 là n số. Ghi vào output.txt: dòng 1 là tổng, dòng 2 là dãy sắp xếp tăng dần.", "vin": "5\n3 1 4 1 5", "meo": "Thay cin bằng fin, cout bằng fout. Phần còn lại giống bài mảng bình thường.", "desai": "Tên file sai một ký tự (Input.txt, input.TXT) thì 0 điểm. Đề không nói file thì đừng dùng file.", "gd": "Tên file giả định là input.txt / output.txt. Đề khác thì sửa 2 dòng ifstream và ofstream.", "the": [["Khai báo đọc file input.txt?", "ifstream fin(\"input.txt\");"], ["Khai báo ghi file output.txt?", "ofstream fout(\"output.txt\");"], ["Đề không nhắc đến file thì dùng gì?", "cin / cout, không dùng file, không dùng freopen."]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    ifstream fin(\"input.txt\");\n    ofstream fout(\"output.txt\");\n    int n;\n    fin >> n;\n    vector<long long> a(n);\n    long long tong = 0;\n    for (int i = 0; i < n; i++) {\n        fin >> a[i];\n        tong += a[i];\n    }\n    sort(a.begin(), a.end());\n    fout << tong << endl;\n    for (int i = 0; i < n; i++) {\n        if (i > 0) fout << \" \";\n        fout << a[i];\n    }\n    fout << endl;\n    fin.close();\n    fout.close();\n    return 0;\n}", "vout": "14\n1 1 3 4 5", "fin": "input.txt", "fout": "output.txt", "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (n = 10^5): 0.01 giây trên máy test", "base": null}, {"id": "file_fibo", "ten": "File: Fibonacci thứ n", "nhom": "file", "sao": 4, "tier": 2, "mau": ["M11"], "de": "File input.txt chứa một hoặc nhiều số n (0 ≤ n ≤ 92). Ghi F(n) của từng số vào output.txt, mỗi số một dòng.", "vin": "10\n0", "meo": "while (fin >> n) đọc đến hết file, không cần biết trước có bao nhiêu số.", "desai": "Dùng int cho f thì tràn số.", "gd": "Nếu file có số T ở đầu thì đọc fin >> t trước rồi dùng while (t--).", "the": [["Đọc đến hết file?", "while (fin >> n) { ... }"], ["fin >> n trả về false khi nào?", "Khi đã hết dữ liệu (hoặc đọc lỗi)"], ["Fibonacci n ≤ 92 dùng kiểu gì?", "long long"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nlong long f[100];\n\nint main() {\n    ifstream fin(\"input.txt\");\n    ofstream fout(\"output.txt\");\n    f[0] = 0;\n    f[1] = 1;\n    for (int i = 2; i <= 92; i++) f[i] = f[i - 1] + f[i - 2];\n    int n;\n    while (fin >> n) fout << f[n] << endl;\n    fin.close();\n    fout.close();\n    return 0;\n}", "vout": "55\n0", "fin": "input.txt", "fout": "output.txt", "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 302 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (10^5 dòng): 0.04 giây trên máy test", "base": null}, {"id": "file_struct", "ten": "File: đọc danh sách struct, ghi kết quả sắp xếp", "nhom": "file", "sao": 4, "tier": 2, "mau": ["M7", "M8", "M11"], "de": "File input.txt: n, rồi mỗi sinh viên 2 dòng (họ tên, điểm). Ghi vào output.txt danh sách sắp xếp theo điểm giảm dần, bằng nhau thì tên tăng dần (điểm 2 chữ số thập phân).", "vin": "3\nNguyen A\n8.5\nTran B\n9\nLe C\n8.5", "meo": "Bài struct + cmp như bình thường, chỉ đổi cin thành fin và cout thành fout. getline(fin >> ws, ...).", "desai": "Viết getline(cin >> ws, ...) trong bài file sẽ đọc từ bàn phím, sai. Phải là fin.", "gd": "Tên file và các trường là giả định.", "the": [["Đọc cả dòng tên từ file?", "getline(fin >> ws, a[i].ten);"], ["In số thực 2 chữ số thập phân ra file?", "fout << fixed << setprecision(2) << x;"], ["Có cần fin.close() không?", "Nên viết. Với fout thì bắt buộc nên có để dữ liệu ghi xong."]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nstruct SinhVien {\n    string ten;\n    double diem;\n};\n\nbool cmp(SinhVien a, SinhVien b) {\n    if (a.diem != b.diem) return a.diem > b.diem;\n    return a.ten < b.ten;\n}\n\nint main() {\n    ifstream fin(\"input.txt\");\n    ofstream fout(\"output.txt\");\n    int n;\n    fin >> n;\n    vector<SinhVien> a(n);\n    for (int i = 0; i < n; i++) {\n        getline(fin >> ws, a[i].ten);\n        fin >> a[i].diem;\n    }\n    sort(a.begin(), a.end(), cmp);\n    for (int i = 0; i < n; i++)\n        fout << a[i].ten << \" \" << fixed << setprecision(2)\n             << a[i].diem << endl;\n    fin.close();\n    fout.close();\n    return 0;\n}", "vout": "Tran B 9.00\nLe C 8.50\nNguyen A 8.50", "fin": "input.txt", "fout": "output.txt", "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 300 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (n = 10^5): 0.08 giây trên máy test", "base": null}, {"id": "file_tu_khac", "ten": "File: liệt kê các từ khác nhau (VANBAN.in)", "nhom": "file", "sao": 4, "tier": 2, "mau": ["M9", "M11"], "de": "File VANBAN.in chứa văn bản. In ra màn hình các từ khác nhau (đổi về chữ thường), theo thứ tự từ điển, mỗi từ một dòng.", "vin": "An an BINH\nbinh cuong", "meo": "Đọc từng từ bằng fin >> s, đổi về chữ thường bằng tolower, cho vào set (set tự loại trùng và sắp xếp).", "desai": "Duyệt set phải dùng iterator: set<string>::iterator it. Lấy giá trị bằng *it.", "gd": "Nếu văn bản có dấu câu (. , !) thì đề thường yêu cầu bỏ đi: thêm đoạn code thay các ký tự không phải chữ bằng dấu cách.", "the": [["Duyệt set trong C++98?", "for (it = a.begin(); it != a.end(); it++) cout << *it;"], ["Đổi một ký tự thành chữ thường?", "s[i] = tolower(s[i]);"], ["Vì sao dùng set thay vì vector?", "set tự loại phần tử trùng và tự sắp xếp tăng dần."]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    ifstream fin(\"VANBAN.in\");\n    set<string> a;\n    string s;\n    while (fin >> s) {\n        for (int i = 0; i < (int)s.size(); i++)\n            s[i] = tolower(s[i]);\n        a.insert(s);\n    }\n    set<string>::iterator it;\n    for (it = a.begin(); it != a.end(); it++) cout << *it << endl;\n    fin.close();\n    return 0;\n}", "vout": "an\nbinh\ncuong", "fin": "VANBAN.in", "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (10^6 từ): 0.64 giây trên máy test", "base": null}, {"id": "file_doc_het", "ten": "File: đọc đến hết file DATA.in, in ra màn hình", "nhom": "file", "sao": 4, "tier": 3, "base": "file_fibo", "mau": ["M11"], "de": "File DATA.in chứa các số nguyên, không biết trước số lượng. In ra màn hình (cout) số lượng và tổng của chúng.", "vin": "1 2 3\n4 5", "meo": "while (fin >> x) đọc hết file, kể cả khi dữ liệu nằm trên nhiều dòng.", "desai": "Kiểu bài code.ptit: đọc từ file nhưng in ra màn hình bằng cout. Đọc kỹ đề xem in vào đâu.", "gd": "Tên file DATA.in là giả định. Kiểu bài này hay có số rất lớn thì dùng long long.", "the": [["Đọc file nhưng in ra màn hình thì dùng gì?", "ifstream fin(\"DATA.in\") để đọc, cout để in"], ["Không biết trước số lượng số trong file?", "while (fin >> x)"], ["Số trong file nằm trên nhiều dòng có sao không?", "Không sao, >> tự bỏ qua xuống dòng."]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    ifstream fin(\"DATA.in\");\n    long long x, tong = 0;\n    int dem = 0;\n    while (fin >> x) {\n        tong += x;\n        dem++;\n    }\n    cout << dem << \" \" << tong << endl;\n    fin.close();\n    return 0;\n}", "vout": "5 15", "fin": "DATA.in", "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 302 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (10^6 số): 0.04 giây trên máy test"}, {"id": "tach_noi", "ten": "Tách chuỗi theo ký tự phân cách rồi nối bằng ký tự khác", "nhom": "chuoi", "sao": 4, "tier": 1, "mau": ["M8"], "de": "Dòng 1: xâu s. Dòng 2: hai ký tự a b. Tách s theo ký tự a, rồi nối các phần lại bằng ký tự b.", "vin": "mot,hai,ba\n, -", "meo": "getline(ss, t, a): đọc từ ss đến khi gặp ký tự a. Lưu các phần vào vector rồi in, xen giữa là b.", "desai": "Phần rỗng (\"a,,b\") vẫn được giữ lại thành \"a--b\". Dấu phân cách ở cuối (\"a,b,\") thì getline không tạo phần rỗng cuối, ra \"a-b\".", "gd": "Giả định ký tự phân cách đọc ở dòng 2. Nếu đề cố định (ví dụ luôn tách theo \",\") thì xóa cin >> a >> b và viết thẳng ',', '-'. Ký tự phân cách là dấu cách thì dùng bài chuẩn hóa khoảng trắng.", "the": [["Tách xâu theo dấu phẩy?", "stringstream ss(s); while (getline(ss, t, ',')) v.push_back(t);"], ["\"a,,b\" tách theo dấu phẩy ra mấy phần?", "3 phần: \"a\", \"\", \"b\""], ["\"a,b,\" tách theo dấu phẩy ra mấy phần?", "2 phần: \"a\", \"b\" (không có phần rỗng ở cuối)"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    string s, t;\n    char a, b;\n    getline(cin, s);\n    cin >> a >> b;\n    stringstream ss(s);\n    vector<string> v;\n    while (getline(ss, t, a)) v.push_back(t);\n    for (int i = 0; i < (int)v.size(); i++) {\n        if (i > 0) cout << b;\n        cout << v[i];\n    }\n    cout << endl;\n    return 0;\n}", "vout": "mot-hai-ba", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 302 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (3*10^5 phần): 0.04 giây trên máy test", "base": null}, {"id": "chuan_hoa_ten", "ten": "Chuẩn hóa họ tên", "nhom": "chuoi", "sao": 4, "tier": 1, "mau": ["M8"], "de": "T bộ test, mỗi bộ là một dòng họ tên viết lộn xộn. In lại: mỗi từ viết hoa chữ đầu, các chữ còn lại viết thường, các từ cách nhau 1 dấu cách.", "vin": "2\n  nGUYEN   vAN  a \ntran thi B", "meo": "Tách từ bằng stringstream. Mỗi từ: đổi hết thành chữ thường, rồi x[0] = toupper(x[0]).", "desai": "Thiếu cin >> ws sau cin >> t thì dòng đầu bị đọc thành rỗng.", "gd": "Biến thể \"NGUYEN, Van A\" (họ viết hoa hết đặt cuối): lưu từ vào vector rồi in theo yêu cầu.", "the": [["Đọc dòng sau khi đã cin >> t?", "getline(cin >> ws, s);"], ["Viết hoa chữ cái đầu?", "x[0] = toupper(x[0]);"], ["Đổi cả từ thành chữ thường?", "for (...) x[i] = tolower(x[i]);"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    int t;\n    cin >> t;\n    while (t--) {\n        string s, x;\n        getline(cin >> ws, s);\n        stringstream ss(s);\n        int dem = 0;\n        while (ss >> x) {\n            for (int i = 0; i < (int)x.size(); i++)\n                x[i] = tolower(x[i]);\n            x[0] = toupper(x[0]);\n            if (dem > 0) cout << \" \";\n            cout << x;\n            dem++;\n        }\n        cout << endl;\n    }\n    return 0;\n}", "vout": "Nguyen Van A\nTran Thi B", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (10^5 dòng): 0.12 giây trên máy test", "base": null}, {"id": "chuan_hoa_cach", "ten": "Chuẩn hóa khoảng trắng (tách rồi nối 1 dấu cách)", "nhom": "chuoi", "sao": 4, "tier": 2, "mau": ["M8"], "de": "Cho một dòng có nhiều dấu cách thừa. In lại các từ, cách nhau đúng 1 dấu cách, không có dấu cách ở đầu và cuối.", "vin": "   xin    chao   cac ban  ", "meo": "ss >> t tự bỏ qua mọi khoảng trắng. In từng từ, trước mỗi từ (trừ từ đầu) in 1 dấu cách.", "desai": "Dòng toàn dấu cách thì in dòng trống (đúng). Đọc bằng cin >> s thì chỉ được 1 từ, phải dùng getline.", "gd": "Không có.", "the": [["Tách từ theo khoảng trắng?", "while (ss >> t)"], ["Làm sao không thừa dấu cách đầu/cuối?", "if (dem > 0) cout << \" \"; trước mỗi từ"], ["Đọc cả dòng (khi đây là lệnh đọc đầu tiên)?", "getline(cin, s);"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    string s, t;\n    getline(cin, s);\n    stringstream ss(s);\n    int dem = 0;\n    while (ss >> t) {\n        if (dem > 0) cout << \" \";\n        cout << t;\n        dem++;\n    }\n    cout << endl;\n    return 0;\n}", "vout": "xin chao cac ban", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 302 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (dòng 8*10^5 ký tự): 0.02 giây trên máy test", "base": null}, {"id": "hop_giao_tu", "ten": "Hợp và giao các từ của hai xâu", "nhom": "chuoi", "sao": 4, "tier": 2, "mau": ["M8", "M9"], "de": "Hai dòng s1, s2. In các từ của hợp (dòng 1) và của giao (dòng 2), mỗi từ xuất hiện 1 lần, theo thứ tự từ điển, cách nhau 1 dấu cách.", "vin": "abc ab ab xyz\nab hello abc", "meo": "Tách mỗi xâu vào set. Hợp: cho cả hai vào một set. Giao: từ nào của a có trong b (b.count) thì lấy.", "desai": "set tự sắp xếp và loại trùng, không cần sort. Phân biệt chữ hoa và thường: \"Ab\" khác \"ab\".", "gd": "Nếu đề yêu cầu không phân biệt hoa thường thì đổi về chữ thường trước khi insert. Nếu đề có T bộ test thì đọc t rồi getline(cin >> ws, s1).", "the": [["Kiểm tra từ x có trong set b?", "b.count(x) (khác 0 là có)"], ["Vì sao in ra không cần sort?", "set đã tự sắp xếp tăng dần."], ["Hàm in set không thừa dấu cách?", "if (it != a.begin()) cout << \" \"; trước mỗi phần tử"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nset<string> tach(string s) {\n    stringstream ss(s);\n    string t;\n    set<string> a;\n    while (ss >> t) a.insert(t);\n    return a;\n}\n\nvoid in(set<string> a) {\n    set<string>::iterator it;\n    for (it = a.begin(); it != a.end(); it++) {\n        if (it != a.begin()) cout << \" \";\n        cout << *it;\n    }\n    cout << endl;\n}\n\nint main() {\n    string s1, s2;\n    getline(cin, s1);\n    getline(cin, s2);\n    set<string> a = tach(s1), b = tach(s2), hop, giao;\n    set<string>::iterator it;\n    for (it = a.begin(); it != a.end(); it++) {\n        hop.insert(*it);\n        if (b.count(*it)) giao.insert(*it);\n    }\n    for (it = b.begin(); it != b.end(); it++) hop.insert(*it);\n    in(hop);\n    in(giao);\n    return 0;\n}", "vout": "ab abc hello xyz\nab abc", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 302 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (2 dòng 10^5 từ): 0.19 giây trên máy test", "base": null}, {"id": "bit1_so", "ten": "Dãy bit 1 liên tiếp dài nhất (số nguyên, dạng nhị phân)", "nhom": "chuoi", "sao": 4, "tier": 3, "base": "bit1_chuoi", "mau": ["M1"], "de": "T bộ test, mỗi bộ cho n (0 ≤ n ≤ 10^18). Xét n ở dạng nhị phân, in độ dài dãy bit 1 liên tiếp dài nhất.", "vin": "3\n13\n7\n0", "meo": "n & 1 lấy bit cuối, n >>= 1 bỏ bit cuối. Giống tách chữ số nhưng ở hệ 2.", "desai": "Dùng int thì sai với n lớn. n = 0 thì ra 0.", "gd": "Không có.", "the": [["Lấy bit cuối của n?", "n & 1 (hoặc n % 2)"], ["Bỏ bit cuối của n?", "n >>= 1 (hoặc n /= 2)"], ["13 ở dạng nhị phân và kết quả?", "1101, kết quả 2"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    int t;\n    cin >> t;\n    while (t--) {\n        long long n;\n        cin >> n;\n        int dem = 0, res = 0;\n        while (n > 0) {\n            if (n & 1) dem+

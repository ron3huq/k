+;\n            else dem = 0;\n            res = max(res, dem);\n            n >>= 1;\n        }\n        cout << res << endl;\n    }\n    return 0;\n}", "vout": "2\n3\n0", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (10^5 số 10^18): 0.16 giây trên máy test"}, {"id": "tu_giong_khac", "ten": "Từ giống và từ khác của hai xâu", "nhom": "chuoi", "sao": 4, "tier": 3, "base": "hop_giao_tu", "mau": ["M9"], "de": "Hai dòng s1, s2. Dòng 1: các từ có trong cả hai xâu. Dòng 2: các từ chỉ có trong đúng một xâu. Theo thứ tự từ điển.", "vin": "abc ab xyz\nab hello abc", "meo": "Duyệt a: có trong b thì vào giống, không có thì vào khác. Duyệt b: không có trong a thì vào khác.", "desai": "Quên duyệt b thì thiếu các từ chỉ có trong s2.", "gd": "\"Từ khác\" ở đây hiểu là có trong đúng một xâu. Nếu đề hiểu là \"có ở s1 mà không có ở s2\" thì xem bài tiếp theo.", "the": [["\"Từ khác\" (đối xứng) gồm những từ nào?", "Từ của a không có trong b, cộng với từ của b không có trong a"], ["Từ giống?", "Từ có trong cả a và b (giao)"], ["Kiểu set chứa từ?", "set<string>"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nset<string> tach(string s) {\n    stringstream ss(s);\n    string t;\n    set<string> a;\n    while (ss >> t) a.insert(t);\n    return a;\n}\n\nvoid in(set<string> a) {\n    set<string>::iterator it;\n    for (it = a.begin(); it != a.end(); it++) {\n        if (it != a.begin()) cout << \" \";\n        cout << *it;\n    }\n    cout << endl;\n}\n\nint main() {\n    string s1, s2;\n    getline(cin, s1);\n    getline(cin, s2);\n    set<string> a = tach(s1), b = tach(s2), giong, khac;\n    set<string>::iterator it;\n    for (it = a.begin(); it != a.end(); it++)\n        if (b.count(*it)) giong.insert(*it);\n        else khac.insert(*it);\n    for (it = b.begin(); it != b.end(); it++)\n        if (!a.count(*it)) khac.insert(*it);\n    in(giong);\n    in(khac);\n    return 0;\n}", "vout": "ab abc\nhello xyz", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (2 dòng 3*10^5 từ): 0.04 giây trên máy test"}, {"id": "tu_chi_s1", "ten": "Các từ có trong s1 mà không có trong s2", "nhom": "chuoi", "sao": 4, "tier": 3, "base": "hop_giao_tu", "mau": ["M9"], "de": "Hai dòng s1, s2. In các từ có trong s1 nhưng không có trong s2, theo thứ tự từ điển, mỗi từ một lần.", "vin": "abc ab xyz\nab hello", "meo": "Cho từ của s1 vào a, từ của s2 vào b. Duyệt a, từ nào !b.count(...) thì in.", "desai": "In cách nhau dấu cách, không thừa ở cuối.", "gd": "Đề yêu cầu mỗi từ một dòng thì thay dấu cách bằng endl.", "the": [["Điều kiện \"x không có trong b\"?", "!b.count(x)"], ["Cần mấy stringstream?", "Hai: ss1(s1), ss2(s2)"], ["Có cần sort không?", "Không, set đã tự sắp xếp"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    string s1, s2, t;\n    getline(cin, s1);\n    getline(cin, s2);\n    set<string> a, b;\n    stringstream ss1(s1), ss2(s2);\n    while (ss1 >> t) a.insert(t);\n    while (ss2 >> t) b.insert(t);\n    set<string>::iterator it;\n    int dem = 0;\n    for (it = a.begin(); it != a.end(); it++)\n        if (!b.count(*it)) {\n            if (dem > 0) cout << \" \";\n            cout << *it;\n            dem++;\n        }\n    cout << endl;\n    return 0;\n}", "vout": "abc xyz", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (2 dòng 3*10^5 từ): 0.04 giây trên máy test"}, {"id": "prefix_doan", "ten": "Mảng cộng dồn: tổng đoạn [l, r]", "nhom": "mang1", "sao": 4, "tier": 1, "mau": ["M12"], "de": "Dòng 1: n q (≤ 10^5). Dòng 2: n số. Tiếp theo q dòng, mỗi dòng l r (đánh số từ 1). In tổng các phần tử từ l đến r.", "vin": "5 3\n1 2 3 4 5\n1 3\n2 5\n4 4", "meo": "p[i] = tổng từ phần tử 1 đến i. Tổng đoạn = p[r] - p[l - 1]. p[0] = 0.", "desai": "Đánh số từ 0 thì l - 1 bị âm. Dùng int thì tràn. Mảng p khai báo ngoài main.", "gd": "Định dạng giả định \"n q\" trên một dòng, chỉ số từ 1. Nếu đề đánh số từ 0 thì in p[r + 1] - p[l]. Nếu có T bộ test thì bọc while (t--).", "the": [["Công thức tổng đoạn [l, r]?", "p[r] - p[l - 1]"], ["p[i] tính thế nào?", "p[i] = p[i - 1] + x, với p[0] = 0"], ["Vì sao vòng for đánh số i từ 1?", "Để p[l - 1] với l = 1 là p[0] = 0, không bị âm."]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nlong long p[100005];\n\nint main() {\n    int n, q;\n    cin >> n >> q;\n    p[0] = 0;\n    for (int i = 1; i <= n; i++) {\n        long long x;\n        cin >> x;\n        p[i] = p[i - 1] + x;\n    }\n    while (q--) {\n        int l, r;\n        cin >> l >> r;\n        cout << p[r] - p[l - 1] << endl;\n    }\n    return 0;\n}", "vout": "6\n14\n4", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (n = q = 10^5): 0.14 giây trên máy test", "base": null}, {"id": "mang_co_ban", "ten": "Mảng: tổng, max, min, đếm chẵn, sắp xếp", "nhom": "mang1", "sao": 4, "tier": 1, "mau": ["M1"], "de": "Cho n, rồi n số. Dòng 1 in: tổng, max, min, số lượng số chẵn. Dòng 2 in mảng sắp xếp tăng dần.", "vin": "5\n3 -1 4 1 6", "meo": "Sort xong thì min là a[0], max là a[n - 1].", "desai": "Số âm: -3 % 2 == -1, nên kiểm tra số chẵn phải dùng % 2 == 0 (không dùng == 1 để kiểm tra số lẻ).", "gd": "Thứ tự in là giả định. Đề chỉ hỏi 1 yêu cầu thì bỏ phần còn lại.", "the": [["Sau khi sort tăng, max và min ở đâu?", "max = a[n - 1], min = a[0]"], ["Kiểm tra số lẻ đúng cả với số âm?", "x % 2 != 0 (không dùng x % 2 == 1)"], ["Sắp xếp giảm dần vector a?", "sort(a.rbegin(), a.rend()) hoặc sort(a.begin(), a.end(), greater<long long>())"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    int n;\n    cin >> n;\n    vector<long long> a(n);\n    long long tong = 0;\n    int dem = 0;\n    for (int i = 0; i < n; i++) {\n        cin >> a[i];\n        tong += a[i];\n        if (a[i] % 2 == 0) dem++;\n    }\n    sort(a.begin(), a.end());\n    cout << tong << \" \" << a[n - 1] << \" \" << a[0] << \" \" << dem;\n    cout << endl;\n    for (int i = 0; i < n; i++) {\n        if (i > 0) cout << \" \";\n        cout << a[i];\n    }\n    cout << endl;\n    return 0;\n}", "vout": "13 6 -1 2\n-1 1 3 4 6", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (n = 10^5): 0.04 giây trên máy test", "base": null}, {"id": "tg_vuong_co", "ten": "Bộ ba tạo tam giác vuông (có hay không)", "nhom": "mang1", "sao": 4, "tier": 1, "mau": ["M7"], "de": "T bộ test, mỗi bộ cho n (≤ 5000) và n số dương. In YES nếu có 3 phần tử (khác vị trí) a, b, c sao cho a² + b² = c².", "vin": "2\n5\n3 1 4 6 5\n3\n1 2 3", "meo": "Bình phương hết rồi sort. Với mỗi k (cạnh lớn nhất) dùng hai con trỏ i = 0, j = k - 1: tổng nhỏ thì i++, lớn thì j--.", "desai": "Không bình phương trước thì phải so a*a ở mọi chỗ, dễ sai. Bình phương số 10^6 phải dùng long long.", "gd": "Đề kỳ trước chưa rõ là in YES/NO hay đếm số bộ. Đếm thì xem bài tiếp theo.", "the": [["Hai con trỏ: tổng a[i] + a[j] < a[k] thì làm gì?", "i++ (cần tổng lớn hơn)"], ["Bước chuẩn bị trước hai con trỏ?", "a[i] = a[i] * a[i], rồi sort"], ["Độ phức tạp?", "O(n²), với n = 5000 là khoảng 12.5 triệu phép, chạy nhanh"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    int t;\n    cin >> t;\n    while (t--) {\n        int n;\n        cin >> n;\n        vector<long long> a(n);\n        for (int i = 0; i < n; i++) {\n            cin >> a[i];\n            a[i] = a[i] * a[i];\n        }\n        sort(a.begin(), a.end());\n        bool co = false;\n        for (int k = n - 1; k >= 2 && !co; k--) {\n            int i = 0, j = k - 1;\n            while (i < j) {\n                if (a[i] + a[j] == a[k]) { co = true; break; }\n                if (a[i] + a[j] < a[k]) i++;\n                else j--;\n            }\n        }\n        if (co) cout << \"YES\" << endl;\n        else cout << \"NO\" << endl;\n    }\n    return 0;\n}", "vout": "YES\nNO", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 302 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (n = 5000): 0.01 giây trên máy test", "base": null}, {"id": "stack_xoa_chan", "ten": "Stack: xóa cặp liền kề có tổng chẵn", "nhom": "mang1", "sao": 4, "tier": 1, "mau": ["M15"], "de": "Cho n và dãy n số. Lặp lại: nếu hai phần tử liền kề có tổng chẵn thì xóa cả hai. In số phần tử còn lại.", "vin": "5\n1 3 2 5 4", "meo": "Dùng stack: đỉnh stack cộng x mà chẵn thì pop (xóa cặp), ngược lại push x.", "desai": "Gọi st.top() khi stack rỗng sẽ crash, phải kiểm tra !st.empty() trước. In st.size() chứ không in n.", "gd": "Đề đổi điều kiện (bằng nhau, tổng chia hết cho k...) thì chỉ sửa phần (st.top() + x) % 2 == 0.", "the": [["Điều kiện xóa cặp?", "!st.empty() && (st.top() + x) % 2 == 0"], ["Khai báo stack?", "stack<long long> st;"], ["In kết quả?", "st.size()"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    int n;\n    cin >> n;\n    stack<long long> st;\n    for (int i = 0; i < n; i++) {\n        long long x;\n        cin >> x;\n        if (!st.empty() && (st.top() + x) % 2 == 0) st.pop();\n        else st.push(x);\n    }\n    cout << st.size() << endl;\n    return 0;\n}", "vout": "3", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 302 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (n = 10^5): 0.03 giây trên máy test", "base": null}, {"id": "tg_vuong_dem", "ten": "Đếm số bộ ba tạo tam giác vuông", "nhom": "mang1", "sao": 4, "tier": 3, "base": "tg_vuong_co", "mau": ["M1"], "de": "Cho n (≤ 500) và n số dương. Đếm số bộ chỉ số i < j < k mà 3 phần tử tạo thành tam giác vuông (các phần tử trùng nhau tính là bộ khác nhau).", "vin": "4\n3 4 5 5", "meo": "Bình phương, sort, rồi 3 vòng for i < j < k. Sau khi sort, a[k] luôn là cạnh lớn nhất.", "desai": "3 vòng for chỉ chạy nhanh với n ≤ 500. Nếu n lớn hơn sẽ TLE.", "gd": "Giả định n ≤ 500 và đếm theo chỉ số. Đếm bộ giá trị khác nhau thì phải lọc trùng trước (dùng set).", "the": [["3 vòng for đếm bộ ba bắt đầu thế nào?", "i từ 0, j từ i + 1, k từ j + 1"], ["Điều kiện tam giác vuông sau khi đã bình phương và sort?", "a[i] + a[j] == a[k]"], ["3 4 5 5 có mấy bộ?", "2 bộ (hai số 5 khác vị trí)"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    int n;\n    cin >> n;\n    vector<long long> a(n);\n    for (int i = 0; i < n; i++) {\n        cin >> a[i];\n        a[i] = a[i] * a[i];\n    }\n    sort(a.begin(), a.end());\n    long long dem = 0;\n    for (int i = 0; i < n; i++)\n        for (int j = i + 1; j < n; j++)\n            for (int k = j + 1; k < n; k++)\n                if (a[i] + a[j] == a[k]) dem++;\n    cout << dem << endl;\n    return 0;\n}", "vout": "2", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 302 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (n = 500): 0.01 giây trên máy test"}, {"id": "dem_loai_kytu", "ten": "Đếm chữ hoa, chữ thường, chữ số, ký tự khác", "nhom": "chuoi", "sao": 3, "tier": 2, "mau": ["M1"], "de": "Cho một dòng. In số chữ hoa, số chữ thường, số chữ số, số ký tự khác (kể cả dấu cách).", "vin": "Hello World 2024!", "meo": "So sánh khoảng ký tự: 'A' đến 'Z', 'a' đến 'z', '0' đến '9'.", "desai": "Dùng cin >> s thì mất phần sau dấu cách.", "gd": "Thứ tự in là giả định.", "the": [["Kiểm tra c là chữ hoa?", "c >= 'A' && c <= 'Z'"], ["Kiểm tra c là chữ số?", "c >= '0' && c <= '9'"], ["Đọc dòng có dấu cách?", "getline(cin, s)"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    string s;\n    getline(cin, s);\n    int hoa = 0, thuong = 0, so = 0, khac = 0;\n    for (int i = 0; i < (int)s.size(); i++) {\n        if (s[i] >= 'A' && s[i] <= 'Z') hoa++;\n        else if (s[i] >= 'a' && s[i] <= 'z') thuong++;\n        else if (s[i] >= '0' && s[i] <= '9') so++;\n        else khac++;\n    }\n    cout << hoa << \" \" << thuong << \" \" << so << \" \" << khac << endl;\n    return 0;\n}", "vout": "2 8 4 3", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (dòng 1.2*10^6 ký tự): 0.02 giây trên máy test", "base": null}, {"id": "hop_giao_kytu", "ten": "Hợp và giao các ký tự của hai xâu", "nhom": "chuoi", "sao": 3, "tier": 3, "base": "hop_giao_tu", "mau": ["M9"], "de": "Hai xâu s1, s2 (không có dấu cách). In các ký tự của hợp (dòng 1) và của giao (dòng 2), mỗi ký tự một lần, theo thứ tự mã ASCII.", "vin": "hello\nworld", "meo": "set<char> a(s1.begin(), s1.end()) tạo set ký tự. Duyệt mọi ký tự i từ 0 đến 255.", "desai": "Chữ hoa có mã nhỏ hơn chữ thường: 'A' < 'a'.", "gd": "Giả định in liền nhau, không có dấu cách. Đề cần dấu cách giữa các ký tự thì thêm dấu cách khi in.", "the": [["Tạo set ký tự từ string s1?", "set<char> a(s1.begin(), s1.end());"], ["Thứ tự giữa 'A' và 'a'?", "'A' (65) đứng trước 'a' (97)"], ["Thêm ký tự c vào cuối string?", "hop += c;"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    string s1, s2;\n    cin >> s1 >> s2;\n    set<char> a(s1.begin(), s1.end()), b(s2.begin(), s2.end());\n    string hop = \"\", giao = \"\";\n    for (int i = 0; i < 256; i++) {\n        char c = (char)i;\n        if (a.count(c) || b.count(c)) hop += c;\n        if (a.count(c) && b.count(c)) giao += c;\n    }\n    cout << hop << endl;\n    cout << giao << endl;\n    return 0;\n}", "vout": "dehlorw\nlo", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 302 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (xâu 10^6 ký tự): 0.00 giây trên máy test"}, {"id": "dem_tu", "ten": "Đếm số từ", "nhom": "chuoi", "sao": 3, "tier": 3, "base": "chuan_hoa_ten", "mau": ["M8"], "de": "T bộ test, mỗi bộ là một dòng. In số từ.", "vin": "2\nxin chao ban\n  mot  ", "meo": "while (ss >> x) dem++;", "desai": "Đếm dấu cách + 1 sẽ sai khi có nhiều dấu cách liền nhau.", "gd": "Không có.", "the": [["Đếm từ trong 1 dòng?", "stringstream ss(s); while (ss >> x) dem++;"], ["Vì sao không đếm bằng số dấu cách?", "Có thể có nhiều dấu cách liền nhau hoặc ở đầu/cuối dòng."], ["Có T bộ test thì đọc dòng thế nào?", "getline(cin >> ws, s)"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    int t;\n    cin >> t;\n    while (t--) {\n        string s, x;\n        getline(cin >> ws, s);\n        stringstream ss(s);\n        int dem = 0;\n        while (ss >> x) dem++;\n        cout << dem << endl;\n    }\n    return 0;\n}", "vout": "3\n1", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (dòng 3*10^5 từ): 0.00 giây trên máy test"}, {"id": "dao_tu", "ten": "Đảo ngược thứ tự từ", "nhom": "chuoi", "sao": 3, "tier": 3, "base": "chuan_hoa_ten", "mau": ["M8"], "de": "T bộ test, mỗi bộ là một dòng. In các từ theo thứ tự ngược lại.", "vin": "1\ntoi di hoc", "meo": "Cho các từ vào vector, in từ cuối về đầu.", "desai": "Vòng i chạy từ (int)a.size() - 1 về 0. Phải ép (int) vì size() là số không âm.", "gd": "Đề đảo từng ký tự trong mỗi từ thì dùng reverse(x.begin(), x.end()) cho mỗi từ.", "the": [["Duyệt vector từ cuối về đầu?", "for (int i = (int)a.size() - 1; i >= 0; i--)"], ["Vì sao cần (int) trước a.size()?", "size() không âm, a.size() - 1 khi a rỗng sẽ thành số rất lớn."], ["Đảo ngược một xâu?", "reverse(x.begin(), x.end());"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    int t;\n    cin >> t;\n    while (t--) {\n        string s, x;\n        getline(cin >> ws, s);\n        stringstream ss(s);\n        vector<string> a;\n        while (ss >> x) a.push_back(x);\n        for (int i = (int)a.size() - 1; i >= 0; i--) {\n            cout << a[i];\n            if (i > 0) cout << \" \";\n        }\n        cout << endl;\n    }\n    return 0;\n}", "vout": "hoc di toi", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (10^5 dòng): 0.17 giây trên máy test"}, {"id": "tu_dai_nhat", "ten": "Từ dài nhất", "nhom": "chuoi", "sao": 3, "tier": 3, "base": "chuan_hoa_cach", "mau": ["M8"], "de": "Cho một dòng. In từ dài nhất (nếu nhiều từ dài bằng nhau thì lấy từ đầu tiên) và độ dài của nó.", "vin": "toi la sinh vien ptit", "meo": "Duyệt từng từ, dài hơn res thì cập nhật res.", "desai": "Dùng >= thì lấy từ cuối cùng. Đề hỏi từ đầu tiên thì phải dùng >.", "gd": "Đề hỏi từ cuối cùng thì đổi > thành >=.", "the": [["Lấy từ dài nhất xuất hiện đầu tiên dùng dấu gì?", "> (không dùng >=)"], ["Độ dài xâu?", "s.size() hoặc s.length()"], ["Ban đầu res là gì?", "\"\" (xâu rỗng)"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    string s, x, res = \"\";\n    getline(cin, s);\n    stringstream ss(s);\n    while (ss >> x)\n        if (x.size() > res.size()) res = x;\n    cout << res << \" \" << res.size() << endl;\n    return 0;\n}", "vout": "sinh 4", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (dòng 3*10^5 từ): 0.02 giây trên máy test"}, {"id": "dem_tan_suat_mang", "ten": "Đếm số lần xuất hiện mỗi phần tử (theo thứ tự xuất hiện)", "nhom": "mang1", "sao": 3, "tier": 2, "mau": ["M9"], "de": "Cho n và n số. In mỗi giá trị khác nhau và số lần xuất hiện của nó, theo thứ tự xuất hiện đầu tiên.", "vin": "6\n1 2 1 3 2 1", "meo": "map đếm. Duyệt lại mảng, in xong giá trị nào thì đặt dem[giá trị] = 0 để không in lại.", "desai": "Duyệt map thì ra thứ tự tăng dần chứ không phải thứ tự xuất hiện.", "gd": "Đề yêu cầu theo giá trị tăng dần thì duyệt map bằng iterator.", "the": [["Đếm bằng map?", "map<long long, int> dem; dem[x]++;"], ["Giữ thứ tự xuất hiện thế nào?", "Duyệt lại mảng gốc, in xong thì dem[a[i]] = 0"], ["Duyệt map ra thứ tự gì?", "Khóa tăng dần"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    int n;\n    cin >> n;\n    vector<long long> a(n);\n    map<long long, int> dem;\n    for (int i = 0; i < n; i++) {\n        cin >> a[i];\n        dem[a[i]]++;\n    }\n    for (int i = 0; i < n; i++)\n        if (dem[a[i]] > 0) {\n            cout << a[i] << \" \" << dem[a[i]] << endl;\n            dem[a[i]] = 0;\n        }\n    return 0;\n}", "vout": "1 3\n2 2\n3 1", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (n = 10^5): 0.19 giây trên máy test", "base": null}, {"id": "prefix_in", "ten": "In mảng cộng dồn", "nhom": "mang1", "sao": 3, "tier": 3, "base": "prefix_doan", "mau": ["M12"], "de": "Cho n, rồi n số. In mảng cộng dồn: phần tử thứ i là tổng từ phần tử đầu đến phần tử i.", "vin": "4\n1 2 3 4", "meo": "tong += x rồi in tong ngay.", "desai": "Dùng long long.", "gd": "Không có.", "the": [["Mảng cộng dồn của 1 2 3 4?", "1 3 6 10"], ["Có cần lưu mảng không?", "Không, chỉ cần biến tong"], ["Kiểu của tong?", "long long"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    int n;\n    cin >> n;\n    long long tong = 0, x;\n    for (int i = 0; i < n; i++) {\n        cin >> x;\n        tong += x;\n        if (i > 0) cout << \" \";\n        cout << tong;\n    }\n    cout << endl;\n    return 0;\n}", "vout": "1 3 6 10", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (n = 10^5): 0.13 giây trên máy test"}, {"id": "ran_in_hang", "ten": "Con rắn theo hàng: in ma trận cho trước", "nhom": "mang2", "sao": 3, "tier": 1, "mau": ["M13"], "de": "Cho ma trận n × m. In các phần tử theo kiểu con rắn: hàng 0 trái sang phải, hàng 1 phải sang trái, ... Tất cả trên một dòng.", "vin": "3 3\n1 2 3\n4 5 6\n7 8 9", "meo": "Hàng chẵn đi xuôi (cột j), hàng lẻ đi ngược (cột m - 1 - j).", "desai": "Viết m - j thì ra ngoài ma trận. Phải là m - 1 - j.", "gd": "Giả định hàng đầu (hàng 0) đi trái sang phải. Nếu đề cho hàng đầu đi ngược thì đổi i % 2 == 1 thành i % 2 == 0.", "the": [["Cột thực sự cần lấy ở hàng lẻ?", "m - 1 - j"], ["Kiểm tra hàng lẻ?", "i % 2 == 1"], ["Ma trận 1000 × 1000 khai báo ở đâu?", "Ngoài main"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nint a[1005][1005];\n\nint main() {\n    int n, m;\n    cin >> n >> m;\n    for (int i = 0; i < n; i++)\n        for (int j = 0; j < m; j++) cin >> a[i][j];\n    int dem = 0;\n    for (int i = 0; i < n; i++)\n        for (int j = 0; j < m; j++) {\n            int c = j;\n            if (i % 2 == 1) c = m - 1 - j;\n            if (dem > 0) cout << \" \";\n            cout << a[i][c];\n            dem++;\n        }\n    cout << endl;\n    return 0;\n}", "vout": "1 2 3 6 5 4 7 8 9", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 303 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (ma trận 1000x1000): 0.38 giây trên máy test", "base": null}, {"id": "quay_phai", "ten": "Quay ma trận 90° theo chiều kim đồng hồ", "nhom": "mang2", "sao": 3, "tier": 1, "mau": ["M13"], "de": "Cho ma trận n × m. In ma trận sau khi quay 90° theo chiều kim đồng hồ (có m hàng, n cột). (Đề kỳ trước: quay ma trận)", "vin": "2 3\n1 2 3\n4 5 6", "meo": "Hàng i của ma trận cũ thành cột n - 1 - i của ma trận mới: b[j][n - 1 - i] = a[i][j].", "desai": "Ma trận kết quả có m hàng, n cột. Khi in phải dùng i < m, j < n.", "gd": "Giả định quay 90° phải. Ngược chiều kim đồng hồ xem bài tiếp theo. Quay 180° thì b[n - 1 - i][m - 1 - j] = a[i][j] (in n hàng, m cột). Nếu đề \"quay ma trận\" là xoay vòng các phần tử ở biên thì là dạng khác.", "the": [["Công thức quay phải?", "b[j][n - 1 - i] = a[i][j]"], ["Ma trận 2 × 3 quay xong có kích thước?", "3 × 2 (m hàng, n cột)"], ["Quay 180°?", "b[n - 1 - i][m - 1 - j] = a[i][j]"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nint a[1005][1005], b[1005][1005];\n\nint main() {\n    int n, m;\n    cin >> n >> m;\n    for (int i = 0; i < n; i++)\n        for (int j = 0; j < m; j++) {\n            cin >> a[i][j];\n            b[j][n - 1 - i] = a[i][j];\n        }\n    for (int i = 0; i < m; i++) {\n        for (int j = 0; j < n; j++) {\n            if (j > 0) cout << \" \";\n            cout << b[i][j];\n        }\n        cout << endl;\n    }\n    return 0;\n}", "vout": "4 1\n5 2\n6 3", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 303 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (ma trận 1000x1000): 0.37 giây trên máy test", "base": null}, {"id": "duong_cheo", "ten": "Tổng đường chéo chính và chéo phụ", "nhom": "mang2", "sao": 3, "tier": 2, "mau": ["M13"], "de": "Cho ma trận vuông n × n. In tổng đường chéo chính và tổng đường chéo phụ.", "vin": "3\n1 2 3\n4 5 6\n7 8 9", "meo": "Chéo chính: i == j. Chéo phụ: i + j == n - 1.", "desai": "Chéo phụ là i + j == n - 1, không phải == n.", "gd": "Không có.", "the": [["Ô nằm trên đường chéo chính khi nào?", "i == j"], ["Ô nằm trên đường chéo phụ khi nào?", "i + j == n - 1"], ["Phần tam giác trên đường chéo chính?", "j > i"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nlong long a[1005][1005];\n\nint main() {\n    int n;\n    cin >> n;\n    long long chinh = 0, phu = 0;\n    for (int i = 0; i < n; i++)\n        for (int j = 0; j < n; j++) {\n            cin >> a[i][j];\n            if (i == j) chinh += a[i][j];\n            if (i + j == n - 1) phu += a[i][j];\n        }\n    cout << chinh << \" \" << phu << endl;\n    return 0;\n}", "vout": "15 15", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (ma trận 1000x1000): 0.27 giây trên máy test", "base": null}, {"id": "tong_hang_cot", "ten": "Tổng từng hàng, tổng từng cột", "nhom": "mang2", "sao": 3, "tier": 2, "mau": ["M13"], "de": "Cho ma trận n × m. Dòng 1 in tổng từng hàng, dòng 2 in tổng từng cột.", "vin": "2 3\n1 2 3\n4 5 6", "meo": "Khi đọc a[i][j] thì cộng luôn vào hang[i] và cot[j].", "desai": "Mảng hang, cot khai báo ngoài main nên tự bằng 0. Trong main thì phải gán = 0.", "gd": "Không có.", "the": [["Cộng phần tử a[i][j] vào đâu?", "hang[i] += a[i][j]; cot[j] += a[i][j];"], ["Mảng khai báo ngoài main có giá trị ban đầu?", "0"], ["Có bao nhiêu tổng cột?", "m"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nlong long a[1005][1005], hang[1005], cot[1005];\n\nint main() {\n    int n, m;\n    cin >> n >> m;\n    for (int i = 0; i < n; i++)\n        for (int j = 0; j < m; j++) {\n            cin >> a[i][j];\n            hang[i] += a[i][j];\n            cot[j] += a[i][j];\n        }\n    for (int i = 0; i < n; i++) {\n        if (i > 0) cout << \" \";\n        cout << hang[i];\n    }\n    cout << endl;\n    for (int j = 0; j < m; j++) {\n        if (j > 0) cout << \" \";\n        cout << cot[j];\n    }\n    cout << endl;\n    return 0;\n}", "vout": "6 15\n5 7 9", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 303 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (ma trận 1000x1000): 0.28 giây trên máy test", "base": null}, {"id": "tong_bien", "ten": "Tổng các phần tử ở biên", "nhom": "mang2", "sao": 3, "tier": 2, "mau": ["M13"], "de": "Cho ma trận n × m. In tổng các phần tử nằm ở hàng đầu, hàng cuối, cột đầu, cột cuối (mỗi phần tử chỉ tính 1 lần).", "vin": "3 3\n1 2 3\n4 5 6\n7 8 9", "meo": "Ô biên: i == 0 || i == n - 1 || j == 0 || j == m - 1. Dùng || nên ô góc chỉ tính 1 lần.", "desai": "Cộng 4 cạnh riêng rẽ thì các góc bị cộng 2 lần.", "gd": "Đề hỏi tổng phần bên trong thì đảo điều kiện (dùng !).", "the": [["Điều kiện ô nằm ở biên?", "i == 0 || i == n - 1 || j == 0 || j == m - 1"], ["Ma trận 1 × 1 có tổng biên bằng?", "Chính phần tử đó"], ["Vì sao không cộng 4 cạnh riêng?", "Các góc bị cộng 2 lần"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    int n, m;\n    cin >> n >> m;\n    long long tong = 0, x;\n    for (int i = 0; i < n; i++)\n        for (int j = 0; j < m; j++) {\n            cin >> x;\n            if (i == 0 || i == n - 1 || j == 0 || j == m - 1)\n                tong += x;\n        }\n    cout << tong << endl;\n    return 0;\n}", "vout": "40", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 303 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (ma trận 1000x1000): 0.26 giây trên máy test", "base": null}, {"id": "nhan_ma_tran", "ten": "Nhân hai ma trận", "nhom": "mang2", "sao": 3, "tier": 2, "mau": ["M13"], "de": "Cho n m p, ma trận A (n × m) và B (m × p). In C = A × B (n × p).", "vin": "2 2 2\n1 2\n3 4\n5 6\n7 8", "meo": "c[i][j] = tổng theo k của a[i][k] * b[k][j]. Có 3 vòng for, vòng trong cùng là k.", "desai": "Vòng k chạy đến m (số cột của A), không phải n hay p.", "gd": "Giả định nhập n m p trên một dòng. Đề nhân A với chuyển vị của A thì b[k][j] = a[j][k].", "the": [["Công thức c[i][j]?", "c[i][j] += a[i][k] * b[k][j]"], ["Vòng k chạy đến đâu?", "k < m (số cột A = số hàng B)"], ["Kích thước C?", "n × p"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nlong long a[105][105], b[105][105], c[105][105];\n\nint main() {\n    int n, m, p;\n    cin >> n >> m >> p;\n    for (int i = 0; i < n; i++)\n        for (int j = 0; j < m; j++) cin >> a[i][j];\n    for (int i = 0; i < m; i++)\n        for (int j = 0; j < p; j++) cin >> b[i][j];\n    for (int i = 0; i < n; i++)\n        for (int j = 0; j < p; j++)\n            for (int k = 0; k < m; k++) c[i][j] += a[i][k] * b[k][j];\n    for (int i = 0; i < n; i++) {\n        for (int j = 0; j < p; j++) {\n            if (j > 0) cout << \" \";\n            cout << c[i][j];\n        }\n        cout << endl;\n    }\n    return 0;\n}", "vout": "19 22\n43 50", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 301 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (100x100 nhân 100x100): 0.01 giây trên máy test", "base": null}, {"id": "xoan_dien_tang", "ten": "Xoắn ốc: điền 1..n*m tăng dần", "nhom": "mang2", "sao": 3, "tier": 2, "mau": ["M14"], "de": "Cho n, m. Điền 1, 2, ..., n*m vào ma trận theo hình xoắn ốc (bắt đầu từ góc trên trái, đi theo chiều kim đồng hồ) rồi in.", "vin": "3 4", "meo": "4 biên tren, duoi, trai, phai. Đi theo thứ tự TRÊN (trái sang phải), PHẢI (xuống), DƯỚI (sang trái), TRÁI (lên). Đi xong cạnh nào thì co biên đó lại.", "desai": "Thiếu if (tren <= duoi) và if (trai <= phai) ở 2 cạnh sau thì ma trận 1 × n hoặc n × 1 bị ghi đè.", "gd": "Khó nhất, để học sau cùng. Đề đi ngược chiều kim đồng hồ thì đổi thứ tự cạnh: TRÁI, DƯỚI, PHẢI, TRÊN.", "the": [["Thứ tự 4 cạnh xoắn ốc?", "TRÊN, PHẢI, DƯỚI, TRÁI (tren++, phai--, duoi--, trai++)"], ["Hai cạnh nào cần if kiểm tra?", "Cạnh DƯỚI (if tren <= duoi) và cạnh TRÁI (if trai <= phai)"], ["Điều kiện vòng while?", "tren <= duoi && trai <= phai"]], "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nint a[1005][1005];\n\nint main() {\n    int n, m;\n    cin >> n >> m;\n    vector<int> v;\n    for (int i = 1; i <= n * m; i++) v.push_back(i);\n    int tren = 0, duoi = n - 1, trai = 0, phai = m - 1, k = 0;\n    while (tren <= duoi && trai <= phai) {\n        for (int j = trai; j <= phai; j++) a[tren][j] = v[k++];\n        tren++;\n        for (int i = tren; i <= duoi; i++) a[i][phai] = v[k++];\n        phai--;\n        if (tren <= duoi) {\n            for (int j = phai; j >= trai; j--) a[duoi][j] = v[k++];\n            duoi--;\n        }\n        if (trai <= phai) {\n            for (int i = duoi; i >= tren; i--) a[i][trai] = v[k++];\n            trai++;\n        }\n    }\n    for (int i = 0; i < n; i++) {\n        for (int j = 0; j < m; j++) {\n            if (j > 0) cout << \" \";\n            cout << a[i][j];\n        }\n        cout << endl;\n    }\n    return 0;\n}", "vout": "1 2 3 4\n10 11 12 5\n9 8 7 6", "fin": null, "fout": null, "test": "biên dịch sạch C++98 và C++17 (-Wall -Wextra, không cảnh báo) · 304 test (ví dụ, biên, ngẫu nhiên) khớp lời giải Python · sanitizer sạch · giới hạn lớn nhất (ma trận 1000x1000): 0.07 giây trên máy test", "base": null}, {"id": "ran_dien_hang", "ten": "Con rắn theo hàng: điền 1..n*m", "nhom": "mang2", "sao": 3, "tier": 3, "base": "ran_in_hang", "mau": ["M13"], "de": "Cho n, m. Điền các số 1, 2, ..., n*m vào ma trận theo kiểu con rắn theo hàng rồi in ma trận.", "vin": "3 4", "meo": "dem chạy từ 1. Hàng chẵn gán a[i][j] = dem, hàng lẻ gán a[i][m - 1 - j] = dem.", "desai": "Nhớ dem++ sau mỗi lần gán.", "gd": "Như bài trên.", "the": [["Hàng lẻ điền vào ô nào?", "a[i][m - 1 - j] = dem"], ["dem bắt đầu bằng?", "1"], ["In ma trận không thừa dấu cách?", "if (j > 0) cout << \" \"; rồi cout << endl cuối mỗi hàng"]], "code": "#i : "Khung chương trình + T bộ test", "nd": "Đề nào cũng vậy. Đề có \"T bộ test\" thì thêm while (t--).", "code": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    int t;\n    cin >> t;\n    while (t--) {\n        // xử lý 1 bộ test\n    }\n    return 0;\n}", "nho": "Đề không có T thì xóa 3 dòng t. Hàm phụ (nt, ucln, cmp) đặt TRÊN main."}, {"id": "M2", "ten": "Kiểm tra nguyên tố nt()", "nd": "Đề có chữ \"nguyên tố\", \"snt\", \"stn\".", "code": "bool nt(long long n) {\n    if (n < 2) return false;\n    for (long long i = 2; i * i <= n; i++)\n        if (n % i == 0) return false;\n    return true;\n}", "nho": "Nhớ 3 ý: n < 2 thì sai, i * i <= n, gặp ước thì false."}, {"id": "M3", "ten": "Duyệt ước / phân tích thừa số", "nd": "Đề có chữ \"ước\", \"thừa số\", \"phân tích\", \"ước nguyên tố lớn nhất\".", "code": "for (long long i = 2; i * i <= n; i++) {\n    int dem = 0;\n    while (n % i == 0) { n /= i; dem++; }\n    // dem > 0: i là thừa số, mũ = dem\n}\nif (n > 1) { /* n còn lại là số nguyên tố, mũ 1 */ }", "nho": "Không bao giờ quên dòng if (n > 1) cuối cùng."}, {"id": "M4", "ten": "UCLN Euclid, BCNN", "nd": "Đề có \"ước chung\", \"bội chung\", \"UCLN\", \"BCNN\", \"rút gọn phân số\".", "code": "long long ucln(long long a, long long b) {\n    while (b != 0) {\n        long long r = a % b;\n        a = b;\n        b = r;\n    }\n    return a;\n}\n// BCNN = a / ucln(a, b) * b   (chia trước, nhân sau)", "nho": "BCNN chia trước nhân sau để không tràn số."}, {"id": "M5", "ten": "Tách chữ số (% 10 và / 10)", "nd": "Đề có \"chữ số\", \"tổng chữ số\", \"số đảo\", \"thuận nghịch\".", "code": "while (n > 0) {\n    int cs = n % 10;   // chữ số cuối\n    // dùng cs ...\n    n /= 10;           // bỏ chữ số cuối\n}", "nho": "Số quá dài, hoặc cần sửa chữ số (đổi 5-6, lấy 3 chữ số đầu) thì đọc vào string."}, {"id": "M6", "ten": "Sàng nguyên tố (+ đếm cộng dồn)", "nd": "Đề cho n đến 10^6, 10^7, hoặc rất nhiều truy vấn về nguyên tố.", "code": "bool p[10000001];\nfor (int i = 2; i <= n; i++) p[i] = true;\nfor (int i = 2; i * i <= n; i++)\n    if (p[i])\n        for (int j = i * i; j <= n; j += i) p[j] = false;", "nho": "Mảng lớn khai báo NGOÀI main."}, {"id": "M7", "ten": "sort với hàm cmp", "nd": "Đề có \"sắp xếp theo ... giảm dần, nếu bằng nhau thì ...\".", "code": "bool cmp(Kieu a, Kieu b) {\n    if (a.x != b.x) return a.x > b.x;   // tiêu chí 1 (giảm)\n    return a.y < b.y;                   // tiêu chí 2 (tăng)\n}\nsort(a.begin(), a.end(), cmp);", "nho": "Giảm dùng >, tăng dùng <. Không bao giờ dùng >= hay <= trong cmp."}, {"id": "M8", "ten": "Đọc dòng có dấu cách + tách từ", "nd": "Đề có \"họ tên\", \"xâu gồm nhiều từ\", \"chuẩn hóa\", \"đếm từ\".", "code": "string s, x;\ngetline(cin >> ws, s);   // có ws khi trước đó đã cin >>\nstringstream ss(s);\nwhile (ss >> x) {\n    // x là từng từ\n}", "nho": "Thiếu cin >> ws thì getline đọc phải dòng trống, kết quả sai."}, {"id": "M9", "ten": "set / map để đếm, lọc trùng", "nd": "Đề có \"các từ khác nhau\", \"hợp\", \"giao\", \"số lần xuất hiện\".", "code": "set<string> a;              // tự loại trùng, tự sắp tăng\na.insert(x);\nif (a.count(x)) { ... }     // x có trong a?\nmap<long long, int> dem;\ndem[x]++;", "nho": "set đã tự sắp xếp, không cần sort nữa."}, {"id": "M10", "ten": "class + friend >> << + toán tử", "nd": "Đề có \"lớp\", \"class\", \"nạp chồng toán tử\", \"hàm bạn\", \"số phức\", \"phân số\".", "code": "class A {\n    int x;\npublic:\n    friend istream& operator>>(istream& in, A& a) {\n        in >> a.x; return in;\n    }\n    friend ostream& operator<<(ostream& out, A a) {\n        out << a.x; return out;\n    }\n};   // <-- DẤU ;", "nho": "Dấu & ở istream& và A& a (nhập phải có &). Dấu ; sau }."}, {"id": "M11", "ten": "Vào ra file ifstream / ofstream", "nd": "Đề có tên file: input.txt, DATA.in, VANBAN.in...", "code": "ifstream fin(\"input.txt\");\nofstream fout(\"output.txt\");\nfin >> n;          // giống cin\nfout << res;       // giống cout\nwhile (fin >> x) { }   // đọc đến hết file\nfin.close(); fout.close();", "nho": "Tên file chép đúng từng ký tự của đề. Đề không nói file thì dùng cin/cout."}, {"id": "M12", "ten": "Mảng cộng dồn (prefix sum)", "nd": "Đề có \"tổng đoạn từ l đến r\", \"nhiều truy vấn\".", "code": "p[0] = 0;\nfor (int i = 1; i <= n; i++) p[i] = p[i - 1] + a[i];\n// tổng đoạn [l, r] = p[r] - p[l - 1]", "nho": "Đánh số từ 1, dùng long long."}, {"id": "M13", "ten": "Duyệt ma trận: con rắn, quay, chuyển vị", "nd": "Đề có \"ma trận\", \"zigzag\", \"con rắn\", \"quay 90 độ\".", "code": "for (int i = 0; i < n; i++)\n    for (int j = 0; j < m; j++) {\n        int c = j;\n        if (i % 2 == 1) c = m - 1 - j;   // hàng lẻ đi ngược\n    }\n// quay phải: b[j][n - 1 - i] = a[i][j]", "nho": "Đi ngược: chỉ số = m - 1 - j. Kết quả quay có m hàng, n cột."}, {"id": "M14", "ten": "Xoắn ốc 4 biên", "nd": "Đề có \"xoắn ốc\".", "code": "int tren = 0, duoi = n - 1, trai = 0, phai = m - 1;\nwhile (tren <= duoi && trai <= phai) {\n    // trên: trai->phai, tren++\n    // phải: tren->duoi, phai--\n    // dưới (nếu tren<=duoi): phai->trai, duoi--\n    // trái (nếu trai<=phai): duoi->tren, trai++\n}", "nho": "Thứ tự: TRÊN, PHẢI, DƯỚI, TRÁI. Hai cạnh sau phải có if."}, {"id": "M15", "ten": "Stack xóa cặp liền kề", "nd": "Đề có \"xóa hai phần tử liền kề nếu ...\".", "code": "stack<long long> st;\nif (!st.empty() && dieukien(st.top(), x)) st.pop();\nelse st.push(x);\ncout << st.size();", "nho": "Kiểm tra !st.empty() TRƯỚC khi gọi st.top()."}], "loi": [["Thiếu ; sau } của struct/class", "struct SV {\n    string ten;\n}", "struct SV {\n    string ten;\n};", "Lỗi biên dịch. Struct/class luôn kết thúc bằng };"], ["Quên using namespace std;", "#include <bits/stdc++.h>\nint main() { cout << 1; }", "#include <bits/stdc++.h>\nusing namespace std;", "Lỗi \"cout was not declared\"."], ["Viết >> liền trong template (C++98)", "vector<pair<int, int>> a;", "vector<pair<int, int> > a;", "Dev-C++ cũ (C++98) báo lỗi. Luôn để dấu cách: > >"], ["Dùng <script>
(function () {

B.forEach(function (b, i) { b.no = i + 1; BI[b.id] = b; });
MAU.forEach(function (m) { MI[m.id] = m; });
var NHOM = {lts: 'Lý thuyết số', 'class': 'Class / Struct', file: 'Vào ra file', chuoi: 'Chuỗi', mang1: 'Mảng 1 chiều', mang2: 'Mảng 2 chiều'};
var TIER = {1: 'BẮT BUỘC', 2: 'NÊN HỌC', 3: 'BIẾN THỂ'};

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function pad(x) { return (x < 10 ? '0' : '') + x; }
function today() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function dayDiff(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5); }
function bodau(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd'); }
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function ask(btn, msg, fn) {

  var old = btn.textContent; btn.setAttribute('data-armed', '1'); btn.textContent = msg;
  setTimeout(function () { if (btn.isConnected) { btn.removeAttribute('data-armed'); btn.textContent = old; } }, 4000);
}

// ---------- luu tien do ----------
var KEY = 'onthi_cpp_ptit_v1', S = {};
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { S = {}; }
  S.b = S.b || {}; S.plan = S.plan || {}; S.fc = S.fc || {}; S.g = S.g || {};
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function bs(id) { return S.b[id] || (S.b[id] = {st: 0, ok: 0, sai: 0, last: '', step: 0}); }
var GAP = [1, 2, 4, 7];
function dueIn(id) { var s = bs(id); if (!s.st || !s.last) return null; return GAP[Math.min(s.step, 3)] - dayDiff(s.last, today()); }
function setSt(id, st) { var s = bs(id); s.st = st; if (st > 0 && !s.last) { s.last = today(); s.step = 0; } save(); refreshAll(id); }

// ---------- to mau cu phap ----------
var KW = 'if else for while do return break continue switch case default struct class public private protected friend const new delete true false this operator using namespace'.split(' ');
var TY = 'int long double float char bool void string vector pair set map stack queue istream ostream ifstream ofstream stringstream unsigned short size_t iterator'.split(' ');
function hl(t) {
  if (/^\s*#/.test(t)) return '<span class="p">' + esc(t) + '</span>';
  var out = '', re = /(\/\/.*$)|("(?:[^"\\]|\\.)*")|('(?:[^'\\]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|([\s\S])/g, m;
  while ((m = re.exec(t))) {
    if (m[1]) out += '<span class="c">' + esc(m[1]) + '</span>';
    else if (m[2] || m[3]) out += '<span class="s">' + esc(m[0]) + '</span>';
    else if (m[4]) out += '<span class="n">' + m[4] + '</span>';
    else if (m[5]) {
      if (KW.indexOf(m[5]) >= 0) out += '<span class="k">' + m[5] + '</span>';
      else if (TY.indexOf(m[5]) >= 0) out += '<span class="ty">' + m[5] + '</span>';
      else out += m[5];
    } else out += esc(m[6]);
  }
  return out;
}

// ---------- chon cho che (co dinh, uu tien cho de sai) ----------
var PAT = [
  [/\w+ \* \w+ <= \w+/, 10], [/(?:cin|in|fin) >> ws/, 10], [/^\s*\};\s*$/, 10], [/\w+\[\w+\] - \w+\[\w+ - 1\]/, 10],
  [/j = i \* i; j <= n; j \+= i/, 9], [/(?:tren|duoi|trai|phai)(?:\+\+|--)/, 9], [/\w+ % 2 == [01]/, 9],
  [/[nm] - 1 - [ij]/, 9], [/(?:istream|ostream)& operator(?:>>|<<)/, 9],
  [/i != n \/ i/, 8], [/if \(n > 1\)/, 8], [/if \(n < 2\) return false;/, 8], [/(?:ifstream fin|ofstream fout)\("[^"]*"\)/, 8],
  [/return a\.\w+ [<>] b\.\w+|return [ax] [<>] [by]/, 8], [/\w+ \/ (?:g|ucln\([^)]*\)) \* \w+/, 8], [/> >/, 8],
  [/[pd]\[i\] = [pd]\[i - 1\] \+ \w+(?:\[i\])?/, 8], [/f\[i\] = [^;]+/, 8], [/!st\.empty\(\) && /, 8],
  [/^\s*public:\s*$/, 7], [/% MOD/, 7], [/getline\([^;]*\)/, 7], [/\w+ \/= (?:i|10|2)\b|n >>= 1/, 7],
  [/substr\([^)]*\)/, 7], [/res = res \* 10 \+ [^;]+/, 7], [/fixed << setprecision\(\d\)/, 7],
  [/long long/, 6], [/sort\([^;]*\)/, 6]
];
function skipLine(t) {
  return /^\s*$/.test(t) || /^\s*#include/.test(t) || /^using namespace/.test(t) || /^\s*[{}]\s*$/.test(t) ||
    /^\s*return 0;\s*$/.test(t) || /^int main\(\) \{$/.test(t);
}
function hsh(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 16777619) >>> 0; } return h; }
function maskInfo(b) {
  if (b._mk) return b._mk;
  var L = b.code.split('\n'), cand = [], n = 0;
  L.forEach(function (t, i) {
    if (skipLine(t)) return;
    n++;
    var best = null;
    for (var k = 0; k < PAT.length; k++) {
      var m = PAT[k][0].exec(t);
      if (m) {
        var s = m.index, e = m.index + m[0].length;
        if (/^\s/.test(m[0])) { var lead = m[0].match(/^\s*/)[0].length; s += lead; e = s + m[0].trim().length; }
        best = {i: i, s: s, e: e, w: PAT[k][1]}; break;
      }
    }
    if (!best) {
      var f = /for \([^;]*; ([^;]*);/.exec(t), w = /(?:while|if) \((.*)\)/.exec(t);
      if (f) { var p = t.indexOf(f[1], f.index); best = {i: i, s: p, e: p + f[1].length, w: 5}; }
      else if (w) { var q = t.indexOf(w[1], w.index); best = {i: i, s: q, e: q + w[1].length, w: 4}; }
      else { var st = t.search(/\S/); best = {i: i, s: st, e: t.replace(/\s+$/, '').length, w: 2}; }
    }
    best.h = hsh(b.id + ':' + i);
    cand.push(best);
  });
  cand.sort(function (x, y) { return y.w - x.w || x.h - y.h; });
  var k1 = Math.max(1, Math.round(n * 0.2)), k2 = Math.max(2, Math.round(n * 0.5));
  var lv = {1: {}, 2: {}};
  cand.forEach(function (c, j) { if (j < k1) lv[1][c.i] = c; if (j < k2) lv[2][c.i] = c; });
  b._mk = {lv: lv, cand: cand, lines: L};
  return b._mk;
}

// ---------- so sanh dong (LCS) ----------
function lcsAlign(a, b) {
  var n = a.length, m = b.length, dp = [], i, j;
  for (i = 0; i <= n; i++) { dp.push([]); for (j = 0; j <= m; j++) dp[i].push(0); }
  for (i = n - 1; i >= 0; i--) for (j = m - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  var ops = []; i = 0; j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { ops.push(['=', i, j]); i++; j++; }
    else if (j < m && (i >= n || dp[i][j + 1] >= dp[i + 1][j])) { ops.push(['+', -1, j]); j++; }
    else { ops.push(['-', i, -1]); i++; }
  }
  return ops;
}
function normLines(code) {
  var raw = code.replace(/\r/g, '').split('\n'), out = [];
  raw.forEach(function (t) { var k = t.replace(/\/\/.*$/, '').replace(/\s+/g, ''); if (k) out.push({k: k, t: t}); });
  return out;
}
function diffBase(b) {
  if (!b.base || !BI[b.base]) return {};
  var a = b.code.split('\n'), c = BI[b.base].code.split('\n');
  var ops = lcsAlign(a.map(function (x) { return x.trim(); }), c.map(function (x) { return x.trim(); })), ch = {};
  ops.forEach(function (o) { if (o[0] === '-' && a[o[1]].trim()) ch[o[1]] = 1; });
  return ch;
}

// ---------- hien thi code ----------
function codeHTML(b, level, showDiff) {
  var mk = maskInfo(b), ch = showDiff ? diffBase(b) : {}, set = level ? mk.lv[level] : {}, h = '';
  mk.lines.forEach(function (t, i) {
    var cls = ch[i] ? 'ln chg' : 'ln', m = set[i], inner;
    if (m) inner = hl(t.slice(0, m.s)) + '<span class="mask" title="Bấm để xem"><span>' + hl(t.slice(m.s, m.e)) + '</span></span>' + hl(t.slice(m.e));
    else inner = hl(t);
    h += '<span class="' + cls + '">' + (inner || ' ') + '</span>';
  });
  return '<pre>' + h + '</pre>';
}

function copyText(t, btn) {
  function ok() { if (btn) { var o = btn.textContent; btn.textContent = '✔ Đã copy'; setTimeout(function () { btn.textContent = o; }, 1200); } }
  function fb() { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta); ok(); }
  try { if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(ok, fb); else fb(); } catch (e) { fb(); }
}

// ---------- so sanh ban cua minh voi dap an ----------
function compareHTML(mine, ans) {
  var A = normLines(mine), C = normLines(ans);
  var ops = lcsAlign(A.map(function (x) { return x.k; }), C.map(function (x) { return x.k; }));
  var L = '', R = '', same = 0;
  for (var q = 0; q < ops.length; q++) {
    var o = ops[q];
    if (o[0] === '-' && ops[q + 1] && ops[q + 1][0] === '+') {
      L += '<span class="dl bad">' + esc(A[o[1]].t) + '</span>'; R += '<span class="dl miss">' + esc(C[ops[q + 1][2]].t) + '</span>'; q++; continue;
    }
    if (o[0] === '=') { same++; L += '<span class="dl ok">' + esc(A[o[1]].t) + '</span>'; R += '<span class="dl ok">' + esc(C[o[2]].t) + '</span>'; }
    else if (o[0] === '-') { L += '<span class="dl bad">' + esc(A[o[1]].t) + '</span>'; R += '<span class="dl">&nbsp;</span>'; }
    else { L += '<span class="dl">&nbsp;</span>'; R += '<span class="dl miss">' + esc(C[o[2]].t) + '</span>'; }
  }
  var pct = C.length ? Math.round(100 * same / Math.max(C.length, A.length)) : 0;
  return '<div class="row"><b>Giống đáp án: ' + pct + '%</b> <span class="small mut">(xanh: khớp · đỏ: dòng của bạn bị sai hoặc thừa · vàng: dòng bạn còn thiếu; đã bỏ qua khoảng trắng)</span></div>' +
    '<div class="grid2"><div><div class="lbl">Bản của bạn</div><pre>' + L + '</pre></div><div><div class="lbl">Đáp án</div><pre>' + R + '</pre></div></div>';
}
